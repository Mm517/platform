body.au{background:var(--soft) radial-gradient(#d9e5ee 1px,transparent 1.2px) 0 0/22px 22px;min-height:100dvh}

.hd{transition:transform .45s cubic-bezier(.3,1.2,.5,1)}.hd.r{transition-delay:.07s}
.cv .hd{transform:translateY(-134px)}

.st{display:none}.st.on{display:block;animation:sin .35s}@keyframes sin{from{opacity:0;transform:translateX(-18px)}}

.au-card input:focus{border-color:var(--bl);box-shadow:0 0 0 4px rgba(8,120,201,.12)}
.au-ph,.au-pw{position:relative}.au-ph input{padding-inline-start:58px;text-align:left}
.au-ph span{position:absolute;inset-inline-start:14px;top:0;bottom:0;display:grid;place-items:center;color:var(--mu);font-weight:600;direction:ltr}
.au-pw input{padding-inline-end:52px}
.au-pw button{position:absolute;right:4px;left:auto;top:3px;width:44px;height:44px;display:grid;place-items:center;color:var(--mu);border-radius:10px}
.au-pw button:active{background:var(--soft)}
.au-str{height:5px;background:var(--bo);border-radius:9px;margin-top:10px;overflow:hidden}.au-str i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.au-hint{color:var(--mu);font-size:13px;margin-top:6px}

.au-btns{display:flex;gap:10px;margin-top:6px}.au-btns .btn{flex:1;min-height:50px;text-align:center}
.au-btns .btn:disabled{opacity:.6}
.au-sw{text-align:center;margin-top:16px;color:var(--mu);font-size:15px}.au-sw a{color:var(--bl);font-weight:600}
@media(max-height:760px){.au-book{width:96px}.au-bub{min-height:34px;margin:4px 0 8px}.au-card{padding:18px 16px}.au-card h1{font-size:22px}}

 <g transform="translate(83 226)"><g class="hd"><g transform="rotate(8)"><rect x="-10" y="8" width="20" height="70" rx="10" fill="#ffcfa0"/><rect x="-20" y="-26" width="10" height="30" rx="5" fill="#ffd9b3"/><rect x="-10" y="-31" width="10" height="35" rx="5" fill="#ffd9b3"/><rect x="0" y="-31" width="10" height="35" rx="5" fill="#ffd9b3"/><rect x="10" y="-26" width="10" height="30" rx="5" fill="#ffd9b3"/><ellipse cx="0" cy="6" rx="22" ry="17" fill="#ffd9b3"/><path d="M-10-24v13M0-28v15M10-24v13" stroke="#e5a877" stroke-width="1.6" stroke-linecap="round" opacity=".7"/></g></g></g>

<script>
const $$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const sv=$('#bsvg'),pu=$$('.pu'),mo=$('#mo'),bub=$('#bub'),card=$('#card');
const MO={n:'M93 118Q105 129 117 118',h:'M91 115Q105 138 119 115',s:'M94 127Q105 117 116 127'};
const PR=['أهلًا بك! ما اسمك؟','رائع! وما رقم موبايلك؟','اختر كلمة سر لا يعرفها غيرك'];
const MSG={captcha_missing:'أكمل التحقق الأمني (أنا لست روبوت) أولًا.',captcha_failed:'تعذر التحقق الأمني، أعد المحاولة.',closed:'اكتمل عدد الطلاب وتم إغلاق التسجيل حاليًا.',user_already_exists:'هذا الرقم مسجّل بالفعل، سجّل دخولك.',invalid_credentials:'بيانات الدخول أو كلمة السر غير صحيحة.',weak_password:'كلمة السر ضعيفة، اختر أقوى.',over_request_rate_limit:'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.',over_email_send_rate_limit:'محاولات كثيرة، انتظر قليلًا ثم أعد المحاولة.',email_not_confirmed:'الحساب غير مفعّل، تواصل مع الدعم.',confirm:'تم إنشاء الحساب لكن التفعيل مطلوب، تواصل مع الدعم.',profile:'تم إنشاء الحساب لكن تعذر حفظ بياناتك، حاول تسجيل الدخول.',banned:'تم حظر هذا الحساب. تواصل مع الإدارة.',signup_disabled:'التسجيل غير متاح حاليًا.'};
const EYE='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
const norm=v=>v.replace(/[٠-٩]/g,x=>"٠١٢٣٤٥٦٧٨٩".indexOf(x)).replace(/^\+?20/,"0").replace(/\D/g,"");
const okPh=v=>/^01[0125]\d{8}$/.test(v),mail=p=>`u${p}@academy-users.com`;
let pend=false,step=0,CAP=null;
/* عدّاد الطلاب: التسجيل بيتقفل لما العدد يوصل للحد (الحد الفعلي بيتحدد من السيرفر في جدول aa_edu_settings) */
const stats=()=>fetch(SUPA_URL+'/rest/v1/rpc/edu_public_stats',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:'{}'}).then(r=>r.ok?r.json():null).catch(()=>null);
const closed=()=>!!(CAP&&CAP.n>=CAP.lim);
$('#wp').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/[^\d+]/g,'')});
$('#fw').addEventListener('submit',async e=>{e.preventDefault();const er=$('#we'),b=$('#wb'),nm=$('#wn').value.trim(),ph=norm($('#wp').value);er.textContent='';
 if(nm.length<2)return fail(er,'اكتب اسمك (حرفان على الأقل).');if(!okPh(ph))return fail(er,'أدخل رقم موبايل مصري صحيح من 11 رقمًا.');
 b.disabled=true;const j=await fetch(SUPA_URL+'/rest/v1/rpc/edu_join_waitlist',{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_name:nm,p_phone:ph})}).then(r=>r.ok?r.json():null).catch(()=>null);
 if(!j||!j.ok){b.disabled=false;return fail(er,'تعذر التسجيل، حاول مرة أخرى.')}
 $('#fw').innerHTML='<b>تم تسجيلك في قائمة الانتظار</b><br>ترتيبك: '+j.pos+'<br>هنتواصل معاك لما يتفتح مكان.';face('h');say('تم تسجيلك!')});
function shut(){const l=location.hash==='#login',c=closed()&&!l;$('#fs').hidden=l||closed();$('#cl').hidden=!c;if(c){face('s');say('التسجيل مغلق، انضم لقائمة الانتظار');$('#ttl').textContent='قائمة الانتظار'}else if(!l)$('#ttl').textContent='إنشاء حساب'}
stats().then(j=>{CAP=j;shut()});

$('#ph').addEventListener('input',e=>{const el=e.target;el.value=el.value.replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/[^\d+]/g,'')});
$('#lph').addEventListener('input',e=>{const el=e.target;el.value=el.value.replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/[^\d+]/g,'')});
/* الكتاب */
const look=(x,y)=>pu.forEach(p=>p.style.transform=`translate(${x*6}px,${y*5}px)`);
const face=m=>mo.setAttribute('d',MO[m]);
const cover=on=>{sv.classList.toggle('cv',on);if(on)look(0,0)};
const say=t=>{bub.classList.remove('pop');void bub.offsetWidth;bub.textContent=t;bub.classList.add('pop')};
function track(el){if(pend||sv.classList.contains('cv'))return;const p=Math.min((el.selectionStart??el.value.length)/16,1),rtl=getComputedStyle(el).direction==='rtl';look((rtl?1-2*p:2*p-1)*.9,+el.dataset.y)}
function fail(el,m){el.textContent=m;face('s');card.classList.remove('sh');void card.offsetWidth;card.classList.add('sh');setTimeout(()=>!pend&&face('n'),1400)}
$$('.au-card input').forEach(el=>{['focus','input','keyup','click','select'].forEach(e=>el.addEventListener(e,()=>track(el)));el.addEventListener('blur',()=>{if(!pend)look(0,0)})});
addEventListener('pointermove',e=>{if(pend||sv.classList.contains('cv')||document.activeElement.matches('input'))return;const r=sv.getBoundingClientRect(),c=v=>Math.max(-1,Math.min(1,v/200));look(c(e.clientX-r.left-r.width/2),c(e.clientY-r.top-r.height*.4))});

/* إظهار / إخفاء كلمة السر
   - كلمة السر مخفية (والخانة فيها المؤشر): الكتاب يحط إيديه على عينيه ويفضل كده طول ما بتكتب
   - لما تضغط "إظهار": الإيدين تنزل والعينين تتابع الكتابة */
function bindPw(pw,btn){
 btn.innerHTML=EYE;
 const sync=()=>{if(pend)return;if(pw.type==='password')cover(true);else{cover(false);track(pw)}};
 pw.addEventListener('focus',sync);
 pw.addEventListener('blur',()=>{if(!pend){cover(false);look(0,0)}});
 btn.addEventListener('pointerdown',e=>e.preventDefault());
 btn.addEventListener('click',()=>{const show=pw.type==='password';pw.type=show?'text':'password';btn.innerHTML=show?EYEOFF:EYE;btn.setAttribute('aria-label',show?'إخفاء كلمة السر':'إظهار كلمة السر');pw.focus({preventScroll:true});sync()});
}
bindPw($('#pw'),$('#eye'));bindPw($('#lpw'),$('#leye'));
$('#pw').addEventListener('input',e=>{const v=e.target.value,s=(v.length>=6)+(v.length>=10)+(/[a-z]/i.test(v)&&/\d/.test(v))+/[^a-z0-9]/i.test(v),b=$('#str');b.style.width=s*25+'%';b.style.background=['#e5e7eb','#ef4444','#f59e0b','#84cc16','#22c55e'][s]});

/* الخادم (Supabase Auth) */
/* Cloudflare Turnstile: بيشتغل بس لو TURNSTILE_SITEKEY متحط في config.js */
const CF=typeof TURNSTILE_SITEKEY==='string'?TURNSTILE_SITEKEY:'',CFW={},CFT={};
function cfShow(k){if(!CF||CFW[k]!=null||!window.turnstile)return;CFW[k]=turnstile.render(k==='s'?'#cfs':'#cfl',{sitekey:CF,language:'ar',callback:t=>{CFT[k]=t},'expired-callback':()=>{CFT[k]=''},'error-callback':()=>{CFT[k]=''}})}
window.cfReady=()=>{if(location.hash==='#login')cfShow('l');else if(step===2)cfShow('s')};
if(CF){const sc=document.createElement('script');sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=cfReady';sc.async=true;document.head.appendChild(sc)}
async function api(path,body){const k=path.includes('signup')?'s':'l';
 if(CF){if(!CFT[k])throw{error_code:'captcha_missing'};body={...body,gotrue_meta_security:{captcha_token:CFT[k]}}}
 try{const r=await fetch(SUPA_URL+path,{method:'POST',headers:{apikey:SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw j;return j}
 finally{if(CF&&CFW[k]!=null){CFT[k]='';turnstile.reset(CFW[k])}}}
const save=(j,name,phone,email)=>setU({id:j.user&&j.user.id,name,phone,email,token:j.access_token,refresh:j.refresh_token});
async function profile(j,name,phone,grade){const r=await fetch(SUPA_URL+'/rest/v1/aa_edu_profiles?on_conflict=id',{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+j.access_token,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({id:j.user.id,name:name||'طالب',phone,grade:grade||'prep3'})});if(!r.ok)throw{error_code:'profile'}}
async function win(t){const f=matchMedia('(prefers-reduced-motion:reduce)').matches?.3:1;cover(false);look(0,.3);await sleep(450*f);face('h');say(t);await sleep(1200*f);$('#sp').classList.add('spin');await sleep(450*f);$('#bk').classList.add('ok');await sleep(1400*f);const nx=sessionStorage.getItem('acad_next');sessionStorage.removeItem('acad_next');location.href=/^[a-z]+([?#][^\s]*)?$/i.test(nx||'')?nx:'home'}
async function run(btn,el,pw,fn,msg){
 pend=true;btn.disabled=true;el.textContent='';say('لحظة من فضلك...');
 try{await fn()}catch(e){pend=false;btn.disabled=false;cover(false);say('حدث خطأ، حاول مرة أخرى');return fail(el,MSG[e.error_code]||MSG[e.code]||'تعذر الاتصال، حاول مرة أخرى.')}
 await win(msg)
}

/* إنشاء حساب على مراحل */
function go(n){step=n;if(n===2)cfShow('s');$('#un').value=norm($('#ph').value);$$('.st').forEach((s,i)=>s.classList.toggle('on',i===n));$$('#prog i').forEach((d,i)=>d.classList.toggle('f',i<=n));
 $('#lab').textContent=`الخطوة ${n+1} من 3`;$('#nx').textContent=n===2?'إنشاء الحساب':'التالي';$('#back').hidden=!n;$('#er').textContent='';face('n');say(PR[n]);
 const f=$$('.st input')[n];f.focus({preventScroll:true})}
$('#back').onclick=()=>go(step-1);
$('#fs').addEventListener('submit',e=>{e.preventDefault();if(pend)return;
 const bad=[()=>$('#nm').value.trim().length<2&&'اكتب اسمك (حرفان على الأقل).',()=>!okPh(norm($('#ph').value))&&'أدخل رقم موبايل مصري صحيح من 11 رقمًا.',()=>$('#pw').value.length<6&&'كلمة السر 6 أحرف على الأقل.'][step]();
 if(bad)return fail($('#er'),bad);
 if(step<2)return go(step+1);
 const name=$('#nm').value.trim(),phone=norm($('#ph').value);
 run($('#nx'),$('#er'),$('#pw'),async()=>{if(closed())throw{error_code:'closed'};let j;try{j=await api('/auth/v1/signup',{email:mail(phone),password:$('#pw').value,data:{name,phone}})}catch(e){if(!e.error_code||e.error_code==='unexpected_failure'){CAP=await stats()||CAP;if(closed()){shut();throw{error_code:'closed'}}}throw e}if(!j.access_token)throw{error_code:'confirm'};await profile(j,name,phone,$('#gr').value);save(j,name,phone)},'تم حفظ كلمة السر')});

/* تسجيل الدخول */
$('#fl').addEventListener('submit',e=>{e.preventDefault();if(pend)return;
 const phone=norm($('#lph').value);
 if(!okPh(phone))return fail($('#le'),'أدخل رقم موبايل مصري صحيح من 11 رقمًا.');
 if(!$('#lpw').value)return fail($('#le'),'اكتب كلمة السر.');
 run($('#lb'),$('#le'),$('#lpw'),async()=>{const j=await api('/auth/v1/token?grant_type=password',{email:mail(phone),password:$('#lpw').value}),nm=(j.user&&j.user.user_metadata&&j.user.user_metadata.name)||'';await profile(j,nm,phone,'prep3');
  const b=await fetch(SUPA_URL+'/rest/v1/aa_edu_profiles?select=banned',{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+j.access_token}}).then(r=>r.ok?r.json():[]).catch(()=>[]);
  if(b[0]&&b[0].banned)throw{error_code:'banned'};save(j,nm,phone)},'تم التحقق من كلمة السر')});

/* التبديل بين الوضعين */
function mode(){const l=location.hash==='#login';$('#fs').hidden=l;$('#fl').hidden=!l;
 $('#ttl').textContent=l?'تسجيل الدخول':'إنشاء حساب';document.title=(l?'تسجيل الدخول':'إنشاء حساب')+' | أكاديمية';
 $('#sw').innerHTML=l?'ليس لديك حساب؟ <a href="#signup">أنشئ حسابًا</a>':'لديك حساب؟ <a href="#login">سجّل دخولك</a>';
 cover(false);face('n');if(l){cfShow('l');say('أهلًا بعودتك! أدخل بياناتك');$('#lph').focus({preventScroll:true})}else go(step);shut()}
addEventListener('hashchange',mode);mode();
</script>
</body>
