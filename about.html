<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>عن المنصة | أكاديمية</title>
<meta name="description" content="تعرّف على منصة أكاديمية وصاحبها وخبراته، وطرق دعم المنصة.">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="theme-color" content="#0878C9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mm517.github.io/platform/about">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css">
<style>
.ab-hero{position:relative;overflow:hidden;border-radius:24px;padding:34px 28px;color:#fff;background:linear-gradient(135deg,#0878C9,#075B98 60%,#06406b);margin-bottom:18px}
.ab-hero::before,.ab-hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:abf 9s ease-in-out infinite}
.ab-hero::before{width:220px;height:220px;inset-inline-start:-60px;top:-80px}
.ab-hero::after{width:150px;height:150px;inset-inline-end:-30px;bottom:-60px;animation-delay:-4s}
.ab-hero h1{position:relative;font-size:clamp(24px,4vw,34px);margin:0 0 8px;color:#fff}
.ab-hero p{position:relative;margin:0;max-width:62ch;line-height:1.9;color:#dcefff;white-space:pre-line}
@keyframes abf{50%{transform:translateY(18px) scale(1.06)}}

.ab-sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:1px solid var(--bo);border-radius:18px;padding:6px;margin-bottom:18px;box-shadow:0 4px 18px rgba(16,24,40,.05)}
.ab-sw button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 10px;border-radius:13px;font-weight:700;font-size:16px;color:var(--mu);transition:background .2s,color .2s,transform .15s}
.ab-sw button:hover{background:#f1f7fd}
.ab-sw button.on{background:var(--bl);color:#fff;box-shadow:0 6px 16px rgba(8,120,201,.28)}
.ab-sw .soon{font-size:11px;background:#fff3d6;color:#92600a;border-radius:99px;padding:1px 8px}
.ab-sw button.on .soon{background:rgba(255,255,255,.22);color:#fff}

.ab-pane{animation:abin .35s ease both}
@keyframes abin{from{opacity:0;transform:translateY(12px)}}

.ab-me{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.ab-ph{border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#0878C9,#075B98);aspect-ratio:1/1;display:grid;place-items:center;color:#fff;font-size:84px;font-weight:700;box-shadow:0 14px 34px rgba(7,91,152,.25);position:relative}
.ab-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ab-nm{font-size:26px;margin:0 0 2px}.ab-rl{color:var(--bl);font-weight:700;margin:0 0 12px}
.ab-bio{line-height:2;white-space:pre-line;color:#26364a}
.ab-h{display:flex;align-items:center;gap:8px;font-size:18px;margin:22px 0 10px}.ab-h svg{color:var(--bl)}
.ab-ex{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ab-ex li{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--bo);border-radius:14px;padding:11px 14px;line-height:1.8;animation:abin .4s ease both}
.ab-ex li svg{flex:none;margin-top:5px;color:#16a34a}
.ab-lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ab-lk .btn{display:inline-flex;align-items:center;gap:6px}
@media(max-width:760px){.ab-me{grid-template-columns:1fr}.ab-ph{max-width:240px;margin:0 auto}.ab-nm,.ab-rl{text-align:center}}

/* الدعم المادي — قريبًا */
.sp{position:relative;overflow:hidden;text-align:center;border-radius:24px;padding:44px 22px 36px;background:linear-gradient(160deg,#fff,#f3f9ff);border:1px solid var(--bo)}
.sp-h{width:92px;height:92px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#f43f5e,#f59e0b);box-shadow:0 14px 34px rgba(244,63,94,.32);animation:abeat 1.8s ease-in-out infinite;position:relative}
.sp-h::before,.sp-h::after{content:'';position:absolute;inset:0;border-radius:50%;border:2px solid rgba(244,63,94,.45);animation:abr 2.4s ease-out infinite}.sp-h::after{animation-delay:1.2s}
@keyframes abeat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes abr{to{transform:scale(1.9);opacity:0}}
.sp h2{font-size:clamp(22px,3.4vw,30px);margin:6px 0}
.sp p{max-width:52ch;margin:0 auto;color:var(--mu);line-height:1.95}
.sp-tag{display:inline-flex;align-items:center;gap:6px;background:#fff3d6;color:#92600a;border-radius:99px;padding:4px 16px;font-weight:700;font-size:14px;margin-bottom:10px}
.sp-tag i{width:8px;height:8px;border-radius:50%;background:#f59e0b;animation:abp 1.2s infinite}
@keyframes abp{50%{opacity:.25}}
.sp-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:26px auto 0;max-width:640px}
.sp-c{position:relative;overflow:hidden;background:#fff;border:1.5px dashed #c5d6e8;border-radius:18px;padding:18px 12px;display:grid;gap:6px;justify-items:center}
.sp-c svg{color:var(--bl)}.sp-c b{font-size:15px}.sp-c small{color:var(--mu)}
.sp-c::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(8,120,201,.10) 50%,transparent 70%);transform:translateX(-100%);animation:abs 2.8s ease-in-out infinite}
.sp-c:nth-child(2)::after{animation-delay:.5s}.sp-c:nth-child(3)::after{animation-delay:1s}
@keyframes abs{to{transform:translateX(100%)}}
.sp-b{margin-top:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body class="cr" data-p="about"><main class="pg" id="m"><div class="skw" aria-busy="true"><div class="sk sk-h"></div><div class="sk sk-ln" style="width:55%"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
topbar();
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():'';
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
let A={},tab=location.hash=='#support'?1:0;

function me(){
 const nm=A.name||'صاحب المنصة',pg=safeUrl(A.page_url),
  soc=lines(A.socials).map(l=>{const [n,...r]=l.split('|');return[(n||'').trim(),safeUrl(r.join('|'))]}).filter(x=>x[0]&&x[1]),
  ex=lines(A.experience);
 const empty=!A.name&&!A.bio&&!A.photo&&!ex.length;
 return `<div class="ab-pane ab-me"><div class="ab-ph">${A.photo?`<img src="${esc(A.photo)}" alt="${esc(nm)}" loading="lazy" decoding="async">`:esc(nm.charAt(0))}</div>
 <div><h2 class="ab-nm">${esc(nm)}</h2>${A.role_title?`<p class="ab-rl">${esc(A.role_title)}</p>`:''}
 ${A.bio?`<div class="ab-bio">${esc(A.bio)}</div>`:empty?'<p class="muted">هيتم إضافة نبذة تعريفية قريبًا.</p>':''}
 ${ex.length?`<h3 class="ab-h">${ic('trophy',20)} الخبرات</h3><ul class="ab-ex">${ex.map((x,i)=>`<li style="animation-delay:${i*60}ms">${ic('check',16)}<span>${esc(x)}</span></li>`).join('')}</ul>`:''}
 ${pg||soc.length?`<div class="ab-lk">${pg?`<a class="btn btn-p" href="${esc(pg)}" target="_blank" rel="noopener noreferrer">${ic('ext',16)} ${esc(A.page_label||'صفحتي')}</a>`:''}${soc.map(([n,u])=>`<a class="btn btn-o" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${ic('link',16)} ${esc(n)}</a>`).join('')}</div>`:''}
 </div></div>`}

function support(){
 return `<div class="ab-pane sp"><div class="sp-h">${ic('heart',44)}</div><span class="sp-tag"><i></i> قريبًا</span>
 <h2>دعم المنصة</h2>
 <p>المنصة مجانية للطلاب، ودعمك بيساعدنا نكمّل ونضيف شروحات وملفات واختبارات أكتر. طرق الدعم المادي لسه بتتجهّز وهتظهر هنا أول ما تكون جاهزة.</p>
 <div class="sp-g"><div class="sp-c">${ic('book',26)}<b>محتوى أكتر</b><small>شروحات وملخصات جديدة</small></div><div class="sp-c">${ic('cap',26)}<b>مدرسين أكتر</b><small>مواد ومراحل إضافية</small></div><div class="sp-c">${ic('star',26)}<b>مميزات جديدة</b><small>تطوير مستمر للمنصة</small></div></div>
 <div class="sp-b"><a class="btn btn-o" href="updates">${ic('mega',16)} تابع آخر التحديثات</a></div></div>`}

function draw(){
 $('#m').innerHTML=`<section class="ab-hero"><h1>${esc(A.platform_title||'عن أكاديمية')}</h1><p>${esc(A.platform_text||'منصة تعليمية تجمع الشروحات والملفات والاختبارات في مكان واحد، علشان تذاكر بسهولة وتتابع تقدمك.')}</p></section>
 <div class="ab-sw" role="tablist"><button role="tab" class="${tab==0?'on':''}" data-tb="0">${ic('user',18)} عن صاحب المنصة</button><button role="tab" class="${tab==1?'on':''}" data-tb="1">${ic('heart',18)} الدعم المادي <span class="soon">قريبًا</span></button></div>
 <div id="pane">${tab==0?me():support()}</div>`}

document.addEventListener('click',e=>{const b=e.target.closest('[data-tb]');if(!b)return;tab=+b.dataset.tb;try{history.replaceState(null,'',tab?'#support':location.pathname)}catch(_){}draw()});
get('edu_about?id=eq.1').then(r=>{A=r[0]||{}}).catch(()=>{A={}}).finally(()=>{draw();if(A.name)document.title='عن المنصة — '+A.name+' | أكاديمية'});
</script></body></html>
