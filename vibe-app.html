<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مجتمع الفايب كودينج | أكاديمية</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0878C9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vibe.css"></head>
<body>
<header class="va-top"><div class="va-top-in">
 <a href="vibe-app" class="logo"><span class="logo-mark"></span><span>مجتمع الفايب كودينج</span></a>
 <div class="usr"><span class="av" id="av"></span><span><span id="un"></span><small id="ur"></small></span><button class="btn btn-o btn-s" id="lo">خروج</button></div>
</div></header>

<main class="va">
 <h1>أهلًا <span id="hi"></span></h1>
 <p class="muted">كورسات ولايفات وأسئلة وشات — كلها مخصّصة لأعضاء مجتمع الفايب كودينج.</p>
 <div id="ban" class="vc-er" hidden style="background:#fef3f2;border:1px solid #fecdca;border-radius:14px;padding:12px 16px;margin:12px 0"></div>

 <nav class="va-tabs" id="tabs" role="tablist">
  <button class="va-tab on" data-t="courses">الكورسات</button>
  <button class="va-tab" data-t="lives">اللايفات <i class="dot" id="liveDot" hidden></i></button>
  <button class="va-tab" data-t="qa">الأسئلة</button>
  <button class="va-tab" data-t="chat">الشات</button>
  <button class="va-tab" data-t="admin" id="tAdm" hidden>الإدارة</button>
 </nav>

 <section class="pn on" id="p-courses"></section>
 <section class="pn" id="p-lives"></section>
 <section class="pn" id="p-qa"></section>
 <section class="pn" id="p-chat"></section>
 <section class="pn" id="p-admin"></section>
</main>

<script src="config.js"></script><script src="vibe.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
if(!VU()||!VU().token)location.replace('vibe#login');
const ME=VU(),ME_ID=ME.id;let ADM=false,BANNED=false;
const first=(ME.name||'').split(' ')[0]||'صديقي';
$('#hi').textContent=first;$('#un').textContent=ME.name||'';$('#av').textContent=(first[0]||'؟');
$('#lo').onclick=()=>{setVU(null);location.replace('vibe')};
const SK=n=>'<div class="grid">'+Array.from({length:n},()=>'<div class="sk" style="height:200px"></div>').join('')+'</div>';
const nf=new Intl.NumberFormat('ar-EG');
const ERRM={locked:'الشات مقفول حاليًا',slow:'استنى ثانية بين الرسائل'};
const em=e=>ERRM[String(e&&e.message||e).trim()]||'حصل خطأ، جرّب تاني';
async function guard(fn){try{return await fn()}catch(e){toast(em(e),true)}}

/* ============ التابات (كل تاب بيحمّل بياناته أول مرة تفتحه بس) ============ */
const LOADED={},LD={courses:()=>loadCourses(),lives:()=>loadLives(),qa:()=>loadQA(),chat:()=>loadChat(),admin:()=>loadAdmin()};
function tab(t){$$('.va-tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('.pn').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
 if(!LOADED[t]){LOADED[t]=1;LD[t]()}try{history.replaceState(null,'','#'+t)}catch(_){}
 if(t==='chat'){const l=$('#chL');if(l)l.scrollTop=l.scrollHeight}}
$('#tabs').onclick=e=>{const b=e.target.closest('.va-tab');if(b)tab(b.dataset.t)};

/* ============ 1) الكورسات ============ */
let COURSES=[],LESSONS=[],DONE=new Set(),CUR=null,CURL=null;
async function loadCourses(force){const p=$('#p-courses');if(!COURSES.length)p.innerHTML=SK(3);
 try{[COURSES,LESSONS]=await Promise.all([vget('aa_vc_courses?select=*&order=sort,id'),vget('aa_vc_lessons?select=*&order=sort,id')]);
  DONE=new Set((await vget('aa_vc_progress?select=lesson_id')).map(x=>x.lesson_id))}
 catch(e){p.innerHTML='<div class="empty">تعذّر تحميل الكورسات. تأكد إن ملف setup_v20.sql اتشغّل في Supabase.</div>';return}
 CUR?openCourse(CUR,CURL):listCourses()}
function cstat(c){const ls=LESSONS.filter(l=>l.course_id===c.id),d=ls.filter(l=>DONE.has(l.id)).length;return{n:ls.length,d,pct:ls.length?Math.round(d*100/ls.length):0}}
function listCourses(){CUR=null;const p=$('#p-courses');
 if(!COURSES.length){p.innerHTML='<div class="empty">لسه مفيش كورسات منشورة. هتظهر هنا أول ما تتضاف.</div>';return}
 p.innerHTML='<div class="grid">'+COURSES.map(c=>{const s=cstat(c);return `<article class="card cc" data-c="${c.id}" tabindex="0" role="button" aria-label="${esc(c.title)}">
  <div class="cc-cv">${safeUrl(c.cover_url)?`<img src="${esc(c.cover_url)}" alt="" loading="lazy">`:'<span>&lt;/&gt;</span>'}</div>
  <div class="cc-b"><div style="display:flex;justify-content:space-between;gap:8px"><span class="chip">${esc(c.level)}</span><span class="cc-m">${nf.format(s.n)} درس</span></div>
  <h3>${esc(c.title)}</h3>${c.description?`<p>${esc(c.description)}</p>`:''}
  <div class="bar" aria-hidden="true"><i style="width:${s.pct}%"></i></div><div class="cc-m"><span>${s.d?'أنجزت '+nf.format(s.d)+' من '+nf.format(s.n):'لم تبدأ بعد'}</span><b>${nf.format(s.pct)}%</b></div></div></article>`}).join('')+'</div>';
 p.onclick=e=>{const a=e.target.closest('[data-c]');if(a)openCourse(+a.dataset.c)};
 p.onkeydown=e=>{if(e.key==='Enter'){const a=e.target.closest('[data-c]');if(a)openCourse(+a.dataset.c)}}}
function openCourse(id,lid){const c=COURSES.find(x=>x.id===id);if(!c){listCourses();return}CUR=id;const p=$('#p-courses'),ls=LESSONS.filter(l=>l.course_id===id);
 const cur=ls.find(l=>l.id===lid)||ls.find(l=>!DONE.has(l.id))||ls[0];CURL=cur?cur.id:null;const s=cstat(c);
 p.onclick=null;p.onkeydown=null;
 p.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px"><button class="btn btn-o btn-s" id="cb">← كل الكورسات</button><h2 style="font-size:20px">${esc(c.title)}</h2><span class="chip g">${nf.format(s.pct)}% مكتمل</span></div>
 ${cur?`<div class="cv"><div><div class="pl">${playerHTML(cur.video_url)}</div>
  <div class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h3 style="font-size:17px">${esc(cur.title)}</h3>
  <button class="btn ${DONE.has(cur.id)?'btn-o':'btn-p'} btn-s" id="dn">${DONE.has(cur.id)?'✓ تم — إلغاء':'تم إنهاء الدرس'}</button></div>
  ${cur.notes?`<div class="nt">${esc(cur.notes)}</div>`:''}</div></div>
  <div class="card"><b style="display:block;margin-bottom:8px">محتوى الكورس (${nf.format(ls.length)})</b><div class="ls">${ls.map((l,i)=>`<button class="li ${l.id===cur.id?'on':''} ${DONE.has(l.id)?'dn':''}" data-l="${l.id}"><span class="n">${DONE.has(l.id)?'✓':nf.format(i+1)}</span><b>${esc(l.title)}</b></button>`).join('')}</div></div></div>`
 :'<div class="empty" style="margin-top:12px">لسه مفيش دروس في الكورس ده.</div>'}`;
 $('#cb').onclick=()=>{listCourses()};
 p.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>openCourse(id,+b.dataset.l));
 const d=$('#dn');if(d)d.onclick=()=>guard(async()=>{d.disabled=true;
  if(DONE.has(cur.id)){await vdel('aa_vc_progress?lesson_id=eq.'+cur.id+'&user_id=eq.'+ME_ID);DONE.delete(cur.id)}
  else{await vpost('aa_vc_progress',{lesson_id:cur.id},'resolution=ignore-duplicates,return=minimal');DONE.add(cur.id);
   const nx=ls[ls.findIndex(l=>l.id===cur.id)+1];if(nx){openCourse(id,nx.id);toast('أحسنت! الدرس اللي بعده جاهز');return}toast('أحسنت!')}
  openCourse(id,cur.id)})}

/* ============ 2) اللايفات ============ */
let LIVES=[];
async function loadLives(){const p=$('#p-lives');p.innerHTML=SK(2);
 try{LIVES=await vget('aa_vc_lives?select=*&order=starts_at.desc&limit=60')}catch(_){p.innerHTML='<div class="empty">تعذّر تحميل اللايفات.</div>';return}renderLives()}
function renderLives(){const p=$('#p-lives'),now=LIVES.filter(l=>l.status==='live'),up=LIVES.filter(l=>l.status==='upcoming').sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at)),end=LIVES.filter(l=>l.status==='ended');
 $('#liveDot').hidden=!now.length;
 const nowH=now.map(l=>{const id=ytId(l.url);return `<div class="lv-now"><div class="tt"><i></i> لايف مباشر الآن: ${esc(l.title)}</div>
  ${id?`<div class="pl"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&autoplay=0" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="${esc(l.title)}"></iframe></div>`
  :(safeUrl(l.url)?`<a class="btn btn-p" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">ادخل اللايف</a>`:'<p>الرابط هيتضاف حالًا.</p>')}</div>`}).join('');
 const row=(l,k)=>`<div class="card lv-row"><div><div class="lv-dt">${fdt(l.starts_at)}</div><h3>${esc(l.title)}</h3>${l.description?`<p>${esc(l.description)}</p>`:''}</div>
  <div>${k==='u'?(safeUrl(l.url)?`<a class="btn btn-o btn-s" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">رابط اللايف</a>`:'<span class="chip y">قريبًا</span>'):(safeUrl(l.replay_url)?`<a class="btn btn-p btn-s" href="${esc(l.replay_url)}" target="_blank" rel="noopener noreferrer">شاهد التسجيل</a>`:'<span class="chip">انتهى</span>')}</div></div>`;
 p.innerHTML=nowH+`<h2 style="font-size:18px;margin-top:6px">اللايفات القادمة</h2><div class="stack">${up.length?up.map(l=>row(l,'u')).join(''):'<div class="empty">مفيش لايفات قادمة دلوقتي. هتظهر هنا أول ما تتحدد.</div>'}</div>`
 +(end.length?`<h2 style="font-size:18px;margin-top:22px">لايفات سابقة</h2><div class="stack">${end.map(l=>row(l,'e')).join('')}</div>`:'')}

/* ============ 3) الأسئلة ============ */
let QS=[],ANS={},OPEN=null;
async function loadQA(){const p=$('#p-qa');p.innerHTML=SK(2);
 try{QS=await vget('aa_vc_questions?select=*&order=id.desc&limit=80');const ids=QS.map(q=>q.id);ANS={};
  if(ids.length)(await vget('aa_vc_answers?select=*&question_id=in.('+ids.join(',')+')&order=id')).forEach(a=>(ANS[a.question_id]=ANS[a.question_id]||[]).push(a))}
 catch(_){p.innerHTML='<div class="empty">تعذّر تحميل الأسئلة.</div>';return}renderQA()}
function renderQA(){const p=$('#p-qa');
 p.innerHTML=`<div class="card"><b style="display:block;margin-bottom:8px">اسأل سؤال</b><form class="fm" id="qf"><input id="qt" maxlength="140" placeholder="عنوان السؤال (مثال: البرومبت مش بيطلّع الشكل اللي عايزه)"><textarea id="qb" maxlength="2000" placeholder="اشرح المشكلة بالتفصيل... (اختياري)"></textarea><button class="btn btn-p" style="align-self:flex-start">إرسال السؤال</button></form></div>
 <div class="stack" id="ql"></div>`;renderList();
 $('#qf').onsubmit=e=>{e.preventDefault();const t=$('#qt').value.trim(),b=$('#qb').value.trim();if(t.length<4)return toast('اكتب عنوان للسؤال (4 أحرف على الأقل)',true);
  guard(async()=>{const r=await vpost('aa_vc_questions',{title:t,body:b});QS.unshift(r[0]);OPEN=r[0].id;$('#qt').value='';$('#qb').value='';renderList();toast('تم إرسال سؤالك')})};
 $('#ql').onclick=qClick}
function renderList(){$('#ql').innerHTML=QS.length?QS.map(qHTML).join(''):'<div class="empty">لسه مفيش أسئلة. اسأل أول سؤال!</div>'}
function qHTML(q){const as=ANS[q.id]||[],op=OPEN===q.id,mine=q.user_id===ME_ID;
 return `<article class="card" data-q="${q.id}"><div class="qh" data-tg="${q.id}"><div><h3>${esc(q.title)}</h3><div class="qm">${esc(q.name)} · ${ago(q.created_at)} · ${nf.format(as.length)} رد</div></div>${q.solved?'<span class="chip g">تم الحل</span>':''}</div>
 ${op?`${q.body?`<div class="qb">${esc(q.body)}</div>`:''}${as.map(a=>`<div class="an ${a.is_staff?'st':''}"><small><b>${esc(a.name)}</b>${a.is_staff?' <span class="chip">المدرّس</span>':''} · ${ago(a.created_at)}${a.user_id===ME_ID||ADM?` · <a href="#" data-da="${a.id}" style="color:#b42318">حذف</a>`:''}</small><p>${esc(a.body)}</p></div>`).join('')}
 <form class="sf" data-af="${q.id}"><input maxlength="2000" placeholder="اكتب ردك..."><button class="btn btn-p btn-s">رد</button></form>
 ${mine||ADM?`<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-o btn-s" data-sv="${q.id}">${q.solved?'إلغاء "تم الحل"':'تم الحل'}</button><button class="btn btn-r btn-s" data-dq="${q.id}">حذف السؤال</button></div>`:''}`:''}</article>`}
function qClick(e){const t=e.target;let el;
 if(el=t.closest('[data-da]')){e.preventDefault();return guard(async()=>{await vdel('aa_vc_answers?id=eq.'+el.dataset.da);for(const k in ANS)ANS[k]=ANS[k].filter(a=>a.id!=el.dataset.da);renderList()})}
 if(el=t.closest('[data-sv]')){const q=QS.find(x=>x.id==el.dataset.sv);return guard(async()=>{await vpatch('aa_vc_questions?id=eq.'+q.id,{solved:!q.solved});q.solved=!q.solved;renderList()})}
 if(el=t.closest('[data-dq]')){if(!confirm('تحذف السؤال؟'))return;return guard(async()=>{await vdel('aa_vc_questions?id=eq.'+el.dataset.dq);QS=QS.filter(x=>x.id!=el.dataset.dq);renderList()})}
 if(t.closest('.sf'))return;
 if(el=t.closest('[data-tg]')){OPEN=OPEN===+el.dataset.tg?null:+el.dataset.tg;renderList()}}
document.addEventListener('submit',e=>{const f=e.target.closest('[data-af]');if(!f)return;e.preventDefault();const i=f.querySelector('input'),b=i.value.trim(),qid=+f.dataset.af;if(!b)return;
 guard(async()=>{const r=await vpost('aa_vc_answers',{question_id:qid,body:b});(ANS[qid]=ANS[qid]||[]).push(r[0]);renderList()})});

/* ============ 4) الشات (Realtime + احتياطي بالفحص الدوري) ============ */
const CH={map:new Map(),pin:null,locked:false};let RT_OK=false,SB=null;
function loadChat(){$('#p-chat').innerHTML=`<div class="ch"><div class="ch-h"><span>شات المجتمع</span><small class="muted" id="chS"></small></div><div class="ch-pin" id="chPin" hidden></div>
 <div class="ch-l" id="chL" aria-live="polite"><div class="sk" style="height:40px;width:60%"></div></div><div class="ch-n" id="chN" hidden>الشات مقفول حاليًا</div>
 <form class="ch-c" id="chF"><input id="chI" maxlength="500" placeholder="اكتب رسالتك..." autocomplete="off" enterkeyhint="send"><button class="btn btn-p">إرسال</button></form></div>`;
 $('#chF').onsubmit=e=>{e.preventDefault();const i=$('#chI'),b=i.value.trim();if(!b)return;i.value='';guard(async()=>{const r=await vpost('aa_vc_msgs',{body:b});addMsg(r[0],true)}).then(()=>i.focus())};
 $('#chL').onclick=e=>{const a=e.target.closest('[data-pn],[data-dm]');if(!a)return;guard(async()=>{const id=+(a.dataset.pn||a.dataset.dm);
  if(a.dataset.dm){await vdel('aa_vc_msgs?id=eq.'+id);CH.map.delete(id)}else{const m=CH.map.get(id);await vpatch('aa_vc_msgs?id=eq.'+id,{pinned:!m.pinned});m.pinned=!m.pinned}draw()})};
 (async()=>{try{const [ms,st]=await Promise.all([vget('aa_vc_msgs?select=*&order=id.desc&limit=60'),vget('aa_vc_settings?select=chat_locked')]);
  ms.reverse().forEach(m=>CH.map.set(m.id,m));CH.locked=!!(st[0]&&st[0].chat_locked);draw(true);lockUI()}catch(_){$('#chL').innerHTML='<div class="empty">تعذّر تحميل الشات.</div>'}rtStart()})()}
function lockUI(){const l=CH.locked&&!ADM;$('#chN').hidden=!l;$('#chI').disabled=l;$('#chF button').disabled=l}
function draw(stick){const l=$('#chL');if(!l)return;const near=stick||l.scrollHeight-l.scrollTop-l.clientHeight<120;const ms=[...CH.map.values()].sort((a,b)=>a.id-b.id);
 const pin=ms.filter(m=>m.pinned).pop();const pe=$('#chPin');pe.hidden=!pin;if(pin)pe.innerHTML='📌 <b>'+esc(pin.name)+':</b> '+esc(pin.body);
 l.innerHTML=ms.length?ms.map(m=>{const me=m.user_id===ME_ID;return `<div class="ms ${me?'me':''} ${m.is_staff?'stf':''}"><small>${esc(m.name)}${m.is_staff?' · المدرّس':''}<span>${new Date(m.created_at).toLocaleTimeString('ar-EG',{hour:'numeric',minute:'2-digit'})}</span></small><p>${esc(m.body)}</p>
  ${ADM||me?`<div class="ac">${ADM?`<button data-pn="${m.id}">${m.pinned?'إلغاء التثبيت':'تثبيت'}</button>`:''}<button data-dm="${m.id}">حذف</button></div>`:''}</div>`}).join(''):'<div class="empty">ابدأ المحادثة 👋</div>';
 if(near)l.scrollTop=l.scrollHeight}
function addMsg(m,stick){if(CH.map.has(m.id)&&!stick)return;CH.map.set(m.id,m);draw(stick||false)}
function rtStart(){try{SB=window._VSB=window._VSB||supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},realtime:{params:{eventsPerSecond:10}}});
 SB.realtime.setAuth(VU().token);
 SB.channel('vc-'+ME_ID).on('postgres_changes',{event:'*',schema:'public',table:'aa_vc_msgs'},p=>{if(p.eventType==='DELETE'){CH.map.delete(p.old.id);draw()}else addMsg(p.new)})
  .on('postgres_changes',{event:'*',schema:'public',table:'aa_vc_settings'},p=>{if(p.new){CH.locked=!!p.new.chat_locked;lockUI()}})
  .on('postgres_changes',{event:'*',schema:'public',table:'aa_vc_lives'},()=>{if(LOADED.lives)loadLives();else vget('aa_vc_lives?select=status&status=eq.live&limit=1').then(r=>{$('#liveDot').hidden=!r.length}).catch(()=>{})})
  .subscribe(s=>{RT_OK=s==='SUBSCRIBED'});
 setInterval(async()=>{await vrefresh();try{SB.realtime.setAuth(VU().token)}catch(_){}},20*60*1000)}catch(_){}}
/* احتياطي: لو الـ Realtime مش شغّال بيفحص كل 6 ثواني (والتاب ظاهر بس) */
setInterval(async()=>{if(RT_OK||document.hidden||!LOADED.chat||!$('#p-chat').classList.contains('on'))return;
 try{const last=Math.max(0,...CH.map.keys());(await vget('aa_vc_msgs?select=*&id=gt.'+last+'&order=id')).forEach(m=>addMsg(m))}catch(_){}},6000);

/* ============ 5) الإدارة (للأدمن بس) ============ */
let AS='courses';
function loadAdmin(){const p=$('#p-admin');
 p.innerHTML=`<div class="ad-sub" id="as">${[['courses','الكورسات'],['lessons','الدروس'],['lives','اللايفات'],['members','الأعضاء'],['chat','الشات']].map(([k,t])=>`<button data-s="${k}" class="${k===AS?'on':''}">${t}</button>`).join('')}</div><div id="ab"></div>`;
 $('#as').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;AS=b.dataset.s;$$('#as button').forEach(x=>x.classList.toggle('on',x===b));adm()};adm()}
const tl=v=>{const d=new Date(v);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
async function adm(){const b=$('#ab');b.innerHTML=SK(1);
 try{if(AS==='courses'){const cs=await vget('aa_vc_courses?select=*&order=sort,id');
   b.innerHTML=`<div class="ad-g"><div class="card"><b>الكورسات (${cs.length})</b>${cs.map(c=>`<div class="ad-r"><div><b>${esc(c.title)}</b><br><span class="chip ${c.published?'g':'y'}">${c.published?'منشور':'مخفي'}</span> <span class="chip">ترتيب ${c.sort}</span></div><div class="x"><button class="btn btn-o btn-s" data-pub="${c.id}" data-v="${c.published}">${c.published?'إخفاء':'نشر'}</button><button class="btn btn-o btn-s" data-ec="${c.id}">تعديل</button><button class="btn btn-r btn-s" data-dc="${c.id}">حذف</button></div></div>`).join('')||'<p class="muted">لسه مفيش كورسات.</p>'}</div>
   <div class="card"><b id="cft">إضافة كورس</b><form class="fm" id="cf" style="margin-top:8px"><input type="hidden" id="cid"><input id="ctt" maxlength="120" placeholder="اسم الكورس" required><textarea id="cd" placeholder="وصف مختصر"></textarea><input id="cc" dir="ltr" placeholder="رابط صورة الغلاف (اختياري)"><div class="r2"><input id="cl" placeholder="المستوى (مبتدئ / متوسط / متقدم)" value="مبتدئ"><input id="cs" type="number" placeholder="الترتيب" value="0"></div><button class="btn btn-p">حفظ</button></form></div></div>`;
   window._cs=cs;$('#cf').onsubmit=e=>{e.preventDefault();const o={title:$('#ctt').value.trim(),description:$('#cd').value.trim(),cover_url:$('#cc').value.trim(),level:$('#cl').value.trim()||'مبتدئ',sort:+$('#cs').value||0},id=$('#cid').value;
    guard(async()=>{id?await vpatch('aa_vc_courses?id=eq.'+id,o):await vpost('aa_vc_courses',o,'return=minimal');toast('تم الحفظ');LOADED.courses=0;adm()})}}
  else if(AS==='lessons'){const cs=await vget('aa_vc_courses?select=id,title&order=sort,id');const cid=+(window._lc||(cs[0]&&cs[0].id)||0);window._lc=cid;const ls=cid?await vget('aa_vc_lessons?select=*&course_id=eq.'+cid+'&order=sort,id'):[];
   b.innerHTML=`<div class="card" style="margin-bottom:12px"><select class="fm" id="lcs" style="padding:10px;border:1px solid var(--bo);border-radius:10px;width:100%">${cs.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div>
   ${cid?`<div class="ad-g"><div class="card"><b>دروس الكورس (${ls.length})</b>${ls.map(l=>`<div class="ad-r"><div><b>${esc(l.title)}</b><br><span class="chip">ترتيب ${l.sort}</span></div><div class="x"><button class="btn btn-o btn-s" data-el="${l.id}">تعديل</button><button class="btn btn-r btn-s" data-dl="${l.id}">حذف</button></div></div>`).join('')||'<p class="muted">مفيش دروس.</p>'}</div>
   <div class="card"><b>إضافة / تعديل درس</b><form class="fm" id="lf" style="margin-top:8px"><input type="hidden" id="lid"><input id="lt" maxlength="140" placeholder="عنوان الدرس" required><input id="lv" dir="ltr" placeholder="رابط الفيديو (يوتيوب أو mp4)"><textarea id="ln" placeholder="ملاحظات / ملخص الدرس / روابط"></textarea><input id="ls" type="number" placeholder="الترتيب" value="${ls.length+1}"><button class="btn btn-p">حفظ الدرس</button></form></div></div>`:'<div class="empty">أضف كورس الأول.</div>'}`;
   window._ls=ls;$('#lcs').onchange=e=>{window._lc=+e.target.value;adm()};
   const f=$('#lf');if(f)f.onsubmit=e=>{e.preventDefault();const o={title:$('#lt').value.trim(),video_url:$('#lv').value.trim(),notes:$('#ln').value.trim(),sort:+$('#ls').value||0},id=$('#lid').value;
    guard(async()=>{id?await vpatch('aa_vc_lessons?id=eq.'+id,o):await vpost('aa_vc_lessons',{...o,course_id:cid},'return=minimal');toast('تم الحفظ');LOADED.courses=0;adm()})}}
  else if(AS==='lives'){const ls=await vget('aa_vc_lives?select=*&order=starts_at.desc&limit=60');window._lv=ls;
   b.innerHTML=`<div class="ad-g"><div class="card"><b>اللايفات (${ls.length})</b>${ls.map(l=>`<div class="ad-r"><div><b>${esc(l.title)}</b><br><span class="muted" style="font-size:13px">${fdt(l.starts_at)}</span></div><div class="x"><select data-st="${l.id}" style="padding:5px;border-radius:8px;border:1px solid var(--bo)">${[['upcoming','قادم'],['live','مباشر الآن'],['ended','انتهى']].map(([v,t])=>`<option value="${v}" ${l.status===v?'selected':''}>${t}</option>`).join('')}</select><button class="btn btn-o btn-s" data-elv="${l.id}">تعديل</button><button class="btn btn-r btn-s" data-dlv="${l.id}">حذف</button></div></div>`).join('')||'<p class="muted">لسه مفيش لايفات.</p>'}</div>
   <div class="card"><b>إضافة / تعديل لايف</b><form class="fm" id="vf" style="margin-top:8px"><input type="hidden" id="vid"><input id="vt" maxlength="140" placeholder="عنوان اللايف" required><textarea id="vd" placeholder="وصف مختصر"></textarea><input id="vs" type="datetime-local" required><input id="vu" dir="ltr" placeholder="رابط اللايف (يوتيوب)"><input id="vr" dir="ltr" placeholder="رابط التسجيل بعد الانتهاء (اختياري)"><button class="btn btn-p">حفظ اللايف</button></form></div></div>`;
   $('#vf').onsubmit=e=>{e.preventDefault();const o={title:$('#vt').value.trim(),description:$('#vd').value.trim(),starts_at:new Date($('#vs').value).toISOString(),url:$('#vu').value.trim(),replay_url:$('#vr').value.trim()},id=$('#vid').value;
    guard(async()=>{id?await vpatch('aa_vc_lives?id=eq.'+id,o):await vpost('aa_vc_lives',o,'return=minimal');toast('تم الحفظ');LOADED.lives=0;adm()})}}
  else if(AS==='members'){const ms=await vget('aa_vc_members?select=*&order=created_at.desc&limit=300');
   b.innerHTML=`<div class="card"><b>الأعضاء (${nf.format(ms.length)})</b>${ms.map(m=>`<div class="ad-r"><div><b>${esc(m.name)}</b> ${m.banned?'<span class="chip r">محظور</span>':''}<br><span class="muted" style="font-size:12.5px">انضم ${ago(m.created_at)}</span></div>${m.user_id===ME_ID?'':`<div class="x"><button class="btn ${m.banned?'btn-o':'btn-r'} btn-s" data-bn="${m.user_id}" data-v="${m.banned}">${m.banned?'فك الحظر':'حظر'}</button></div>`}</div>`).join('')}</div>`}
  else if(AS==='chat'){const st=await vget('aa_vc_settings?select=chat_locked');const lk=!!(st[0]&&st[0].chat_locked);
   b.innerHTML=`<div class="card ad-r"><div><b>قفل الشات</b><br><span class="muted" style="font-size:13px">لما يتقفل الأعضاء مبيقدروش يكتبوا (إنت بس).</span></div><button class="btn ${lk?'btn-p':'btn-o'}" data-lk="${lk}">${lk?'فتح الشات':'قفل الشات'}</button></div>
   <div class="card" style="margin-top:12px"><b>مسح الشات بالكامل</b><p class="muted" style="font-size:13px;margin:4px 0 10px">بيحذف كل الرسائل نهائيًا.</p><button class="btn btn-r" data-clr="1">مسح كل الرسائل</button></div>`}}
 catch(e){b.innerHTML='<div class="empty">تعذّر التحميل: '+esc(e.message)+'</div>'}}
/* أحداث الإدارة (تفويض واحد) */
document.addEventListener('click',e=>{const t=e.target;let el;
 if(el=t.closest('[data-pub]'))return guard(async()=>{await vpatch('aa_vc_courses?id=eq.'+el.dataset.pub,{published:el.dataset.v!=='true'});LOADED.courses=0;adm()});
 if(el=t.closest('[data-dc]')){if(!confirm('تحذف الكورس وكل دروسه؟'))return;return guard(async()=>{await vdel('aa_vc_courses?id=eq.'+el.dataset.dc);LOADED.courses=0;adm()})}
 if(el=t.closest('[data-ec]')){const c=window._cs.find(x=>x.id==el.dataset.ec);$('#cid').value=c.id;$('#ctt').value=c.title;$('#cd').value=c.description;$('#cc').value=c.cover_url;$('#cl').value=c.level;$('#cs').value=c.sort;$('#cft').textContent='تعديل: '+c.title;$('#ctt').focus();return}
 if(el=t.closest('[data-dl]')){if(!confirm('تحذف الدرس؟'))return;return guard(async()=>{await vdel('aa_vc_lessons?id=eq.'+el.dataset.dl);LOADED.courses=0;adm()})}
 if(el=t.closest('[data-el]')){const l=window._ls.find(x=>x.id==el.dataset.el);$('#lid').value=l.id;$('#lt').value=l.title;$('#lv').value=l.video_url;$('#ln').value=l.notes;$('#ls').value=l.sort;$('#lt').focus();return}
 if(el=t.closest('[data-dlv]')){if(!confirm('تحذف اللايف؟'))return;return guard(async()=>{await vdel('aa_vc_lives?id=eq.'+el.dataset.dlv);LOADED.lives=0;adm()})}
 if(el=t.closest('[data-elv]')){const l=window._lv.find(x=>x.id==el.dataset.elv);$('#vid').value=l.id;$('#vt').value=l.title;$('#vd').value=l.description;$('#vs').value=tl(l.starts_at);$('#vu').value=l.url;$('#vr').value=l.replay_url;$('#vt').focus();return}
 if(el=t.closest('[data-bn]'))return guard(async()=>{await vpatch('aa_vc_members?user_id=eq.'+el.dataset.bn,{banned:el.dataset.v!=='true'});toast('تم');adm()});
 if(el=t.closest('[data-lk]'))return guard(async()=>{await vpatch('aa_vc_settings?id=eq.1',{chat_locked:el.dataset.lk!=='true'});toast('تم');adm()});
 if(el=t.closest('[data-clr]')){if(!confirm('تمسح كل رسائل الشات؟'))return;return guard(async()=>{await vdel('aa_vc_msgs?id=gt.0');CH.map.clear();draw();toast('تم المسح')})}});
document.addEventListener('change',e=>{const s=e.target.closest('[data-st]');if(!s)return;guard(async()=>{await vpatch('aa_vc_lives?id=eq.'+s.dataset.st,{status:s.value});LOADED.lives=0;toast('تم التحديث')})});

/* ============ تشغيل: التحقق من العضوية + صلاحيات الأدمن ============ */
(async()=>{try{const m=await vget('aa_vc_members?select=name,banned&user_id=eq.'+ME_ID);
  if(!m.length){await vpost('aa_vc_members?on_conflict=user_id',{user_id:ME_ID,name:ME.name||'عضو'},'resolution=ignore-duplicates,return=minimal')}
  else if(m[0].banned){BANNED=true;const b=$('#ban');b.hidden=false;b.textContent='تم حظر حسابك من المجتمع. تواصل مع الدعم لو ده خطأ.';$('#tabs').hidden=true;return}}catch(_){}
 try{ADM=await vrpc('vc_is_admin')===true}catch(_){}
 if(ADM){$('#tAdm').hidden=false;$('#ur').textContent='مدرّس'}else $('#ur').textContent='عضو'
 const h=(location.hash||'').slice(1);
 if(h&&LD[h]&&(h!=='admin'||ADM))tab(h);else{LOADED.courses=1;loadCourses()}
 vget('aa_vc_lives?select=status&status=eq.live&limit=1').then(r=>{$('#liveDot').hidden=!r.length}).catch(()=>{})})();
</script>
</body></html>
