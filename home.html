/* ---------- أنيميشن الظهور + العدّادات ---------- */

const P0=Promise.all([ME().then(m=>m?[m]:[]),ok(get('aa_edu_points_log?select=reason,ref,amount,created_at&order=created_at.desc&limit=300')),ok(get('aa_edu_enrollments?select=course_id')),cget('aa_edu_courses_v?order=is_featured.desc,id',null,1),ok(cget('aa_edu_ads?active=eq.true&order=sort,id')),ok(cget('aa_edu_updates?order=created_at.desc&limit=3')),ok(get('aa_edu_quiz_attempts?select=score,total,aa_edu_quizzes(title)&order=created_at.desc&limit=5')),ok(cget('aa_edu_subjects?grade=eq.prep3&order=sort')),cmGet(),schGet()]);

const render=([p,lg,en,cs,ads,up,qa,ss,cm,sc])=>{
 UD=[p,lg,en,qa];window._hsig=JSON.stringify([cs,ads,up,ss]);
 if(cm!==undefined)CM=cm;if(sc)SCH=sc;SUBS=ss||[];
 const n=p[0]?.points||0,name=(p[0]?.name||u.name||'').split(' ')[0],done=new Set(lg.filter(x=>x.reason=='watch').map(x=>String(x.ref))),subs=new Set(en.map(x=>x.course_id));

  <div class="hs-g">${tile(0,'star',n,'نقطة','#f59e0b','#fbbf24')}${tile(1,'bolt',lvl(n),'المستوى','#0878C9','#38bdf8')}${tile(2,'chart',wkp,'نقاط الأسبوع','#7c3aed','#a78bfa')}${tile(3,'flame',st,'أيام متتالية','#ef4444','#fb923c','','يوم')}${tile(4,'check',dl.size,'درس خلّصته','#16a34a','#4ade80')}${tile(5,'book',mine.length,'اشتراكاتك','#0891b2','#22d3ee')}</div>

  </div>
  <div class="hm-two">
   <div class="hbox rv"><b class="t">${ic('trophy',18)} نتائجك</b><div class="lv-bar"><i style="--w:${n%100}%"></i></div><small class="muted">${100-n%100} نقطة للمستوى ${lvl(n)+1}</small>
    <div class="lg"><span>دروس خلّصتها</span><b>${dl.size}</b></div><div class="lg"><span>فيديوهات حل</span><b>${cnt('solution')}</b></div><div class="lg"><span>أسئلة للمدرس</span><b>${cnt('question')}</b></div><div class="lg"><span>تقييمات</span><b>${cnt('review')}</b></div></div>

  </div>

  <h2 class="lsn">${ic('book',20)} الكورسات حسب المادة</h2>
  <div class="fcs"><button class="fc on" data-f="all">الكل</button><button class="fc" data-f="sub">المشترك فيه (${mine.length})</button></div>

  <a class="btn btn-p" style="margin-top:16px" href="courses">ابدأ اختيار المادة والدرس</a>
 </div></div>`;
 drawSch();
 $('#schw').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.t){const x=SCH.find(y=>y.id==b.dataset.t);if(x)schSet(x.id,{done:!x.done})}else if(b.dataset.x)schSet(+b.dataset.x||b.dataset.x,null)};
 document.querySelectorAll('.fc').forEach(b=>b.onclick=()=>{document.querySelectorAll('.fc').forEach(x=>x.classList.toggle('on',x==b));const s=b.dataset.f=='sub';document.querySelectorAll('.hc').forEach(c=>c.hidden=s&&!c.dataset.sub);document.querySelectorAll('.sbj').forEach(x=>x.hidden=![...x.querySelectorAll('.hc')].some(c=>!c.hidden));$('#nosub').hidden=!(s&&!mine.length)});
