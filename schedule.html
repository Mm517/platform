<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول المذاكرة | أكاديمية</title>
<meta name="description" content="جدول المذاكرة | أكاديمية">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0878C9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="home.css"></head>
<body class="cr" data-p="schedule"><main class="pg hm-pg" id="m"><div id="o"><div class="sg" aria-busy="true"><div class="sk" style="height:430px;border-radius:18px"></div><div class="sk" style="height:430px;border-radius:18px"></div></div></div></main>
<script src="config.js"></script><script src="lib.js"></script><script src="sched.js"></script>
<script>
if(!U())location.replace('auth#login');
topbar();
const ok=p=>p.catch(()=>[]);
Promise.all([ok(cget('aa_edu_subjects?grade=eq.prep3&order=sort')),schGet()]).then(([ss,sc])=>{
 SUBS=ss||[];SCH=sc||[];
 $('#o').innerHTML=`<div class="hm-hi"><h1>${ic('cal',26)} جدول المذاكرة</h1></div><p class="muted">ضيف مهامك هنا وهتظهر في جدولك الأسبوعي في الشاشة الرئيسية، واليوم الحالي بيتعلّم بالأزرق.</p>
 <div class="sg">
  <form class="hbox sf" id="sf" autocomplete="off"><b class="t">${ic('plus',18)} مهمة جديدة</b>
   <label>اليوم<select id="sd">${DAYS.map(([d,n])=>`<option value="${d}"${d==TD?' selected':''}>${n}${d==TD?' (النهاردة)':''}</option>`).join('')}</select></label>
   <div class="two2"><label>الوقت<input id="stm" type="time"></label><label>المادة<select id="ssb"><option value="">بدون</option>${SUBS.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label></div>
   <label>المهمة<input id="stx" type="text" maxlength="80" placeholder="مثال: مراجعة درس المعادلات" required></label>
   <button class="btn btn-p" type="submit">${ic('plus',18)} أضف للجدول</button>
   <small class="muted" id="scn"></small></form>
  <section class="hbox sch-p"><div class="sch-h"><b>${ic('cal',18)} جدولك الأسبوعي</b><div id="sct"></div><a class="sch-l" href="home">${ic('right',14)} الرئيسية</a></div><div class="sch-w" id="schw"></div></section>
 </div>`;
 drawSch();
 const cn=()=>{$('#scn').textContent=SCM=='local'?'الجدول محفوظ على جهازك فقط.':'الجدول محفوظ على حسابك وبيظهر على أي جهاز.'};cn();
 $('#sf').onsubmit=async e=>{e.preventDefault();const t=$('#stx').value.trim();if(!t)return;
  await schAdd({day:+$('#sd').value,tm:$('#stm').value||null,title:t,subject_id:$('#ssb').value?+$('#ssb').value:null});
  $('#stx').value='';$('#stm').value='';$('#stx').focus()};
 $('#schw').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){const x=SCH.find(y=>y.id==b.dataset.t);if(x)schSet(x.id,{done:!x.done})}else if(b.dataset.x)schSet(+b.dataset.x||b.dataset.x,null)};
}).catch(()=>{$('#o').innerHTML='<p class="empty">تعذر التحميل، حدّث الصفحة.</p>'});
</script></body></html>
