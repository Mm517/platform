<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدروس | أكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css">
<style>
.un{margin:20px 0 8px;font-weight:700;color:var(--mu);font-size:14px}
.ls{padding:0;overflow:hidden}.ls.open{border-color:var(--bl)}
.lh{display:flex;gap:12px;align-items:center;padding:14px;width:100%;background:none;border:0;font:inherit;text-align:start;color:inherit;cursor:pointer}
.lh .n{width:34px;height:34px;border-radius:50%;background:#e8f3fc;color:var(--bd);display:grid;place-items:center;font-weight:700;flex:none}
.ls.done .n{background:#16a34a;color:#fff}.lh .t{flex:1}.lh small{color:var(--mu)}
.avs{display:flex;flex-direction:row-reverse}.avs .av{width:30px;height:30px;font-size:13px;margin:0 -8px 0 0;border:2px solid #fff}
.lb{padding:2px 14px 14px;border-top:1px solid var(--bo)}.lb h4{margin:14px 0 8px;font-size:15px}
.tb{display:flex;gap:10px;align-items:center;margin:12px 0 6px}.tb .av{width:44px;height:44px;margin:0;font-size:18px}
.sp{background:#fff7e6;color:#b45309;border-radius:20px;font-size:12px;font-weight:700;padding:2px 10px;margin-inline-start:6px}
.pr{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--bo);border-radius:10px;margin-bottom:6px;color:inherit}
.pr:hover{border-color:var(--bl)}.pr .t{flex:1}.pr .pbar{margin-top:5px}.pr .ok{color:#16a34a}
.hl{position:relative}
</style></head>
<body class="cr" data-p="courses"><main class="pg">
<h1>دروس الصف الثالث الإعدادي</h1><div class="crumbs" id="cr"></div><div id="out"><p class="empty">جارٍ التحميل...</p></div>
</main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
topbar();
let subs=[],ls=[],cs=[],tch={},fl=[],qz=[],at=[],pg={},S=0,L=0,RS=null;
const av=t=>t&&t.image?`<span class="av" style="background:#fff url('${esc(t.image)}') center/cover"></span>`:`<span class="av">${esc((t?.name||'?').replace(/^أ\.\s*/,'').charAt(0))}</span>`;
const goto=()=>location.hash=[S,L].filter(Boolean).join('-');
function lessonHtml(l,i){
 const m=cs.filter(c=>c.lesson_id==l.id),tids=[...new Set(m.map(c=>c.teacher_id))],ids=new Set(m.map(c=>c.id)),
  started=m.some(c=>pg[c.id]),done=tids.some(t=>{const p=m.filter(c=>c.teacher_id==t);return p.every(c=>pg[c.id]?.done)}),open=L==l.id,
  files=fl.filter(f=>ids.has(f.course_id)&&f.url),exams=qz.filter(q=>ids.has(q.course_id));
 const head=`<button class="lh" data-tg="${l.id}"><span class="n">${done?ic('check',18):i+1}</span><span class="t"><b>${esc(l.title)}</b><br><small>${m.length?`${m.length} فيديو • ${files.length} مذكرة • ${exams.length} امتحان${started&&!done?' • بدأت فيه':''}`:'لم يُضف محتوى بعد'}</small></span><span class="avs">${tids.slice(0,4).map(t=>av(tch[t])).join('')}</span>${ic(open?'up':'down',18)}</button>`;
 if(!open)return `<div class="box ls ${done?'done':''}" id="l${l.id}">${head}</div>`;
 const vids=tids.map(t=>{const p=m.filter(c=>c.teacher_id==t).sort((a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id),T=tch[t];
  return `<div class="tb">${av(T)}<span><a href="teachers.html?id=${t}"><b>${esc(T?.name||'')}</b></a>${p.length>1?`<span class="sp">الدرس مقسم إلى ${p.length} ${p.length==2?'جزئين':'أجزاء'}</span>`:''}${p.length>1?'<br><small class="muted">اختر الجزء اللي عايز تشوفه</small>':''}</span></div>`+
  p.map((c,k)=>{const g=pg[c.id],pc=g&&g.duration?Math.min(100,Math.round(g.position/g.duration*100)):0;
   return `<a class="pr" href="course.html?id=${c.id}"><span class="${g?.done?'ok':''}">${ic(g?.done?'check':'play',20)}</span><span class="t">${p.length>1?`الجزء ${k+1}: `:''}${esc(c.title)}${g&&!g.done&&pc?`<div class="pbar"><i style="width:${pc}%"></i></div>`:''}</span><small class="muted">${g?.done?'تمت المشاهدة':pc?'كمّل ('+pc+'%)':c.video_url?'ابدأ':'قريبًا'}</small></a>`}).join('')}).join('');
 const notes=files.map(f=>`<div class="pr" style="display:block"><div class="row"><span>${ic(f.kind=='summary'?'note':'file',18)} ${esc(f.title)} <small class="muted">• ${esc(tch[m.find(c=>c.id==f.course_id)?.teacher_id]?.name||'')}</small></span><button class="btn btn-p btn-s" data-vw="${f.id}">فتح</button></div><div id="vw${f.id}"></div></div>`).join('');
 const ex=exams.map(q=>{const b=at.filter(a=>a.quiz_id==q.id).sort((x,y)=>y.score-x.score)[0];return `<a class="pr" href="course.html?id=${q.course_id}&tab=5"><span>${ic('quiz',20)}</span><span class="t">${esc(q.title)}<br><small class="muted">${q.edu_quiz_questions?.[0]?.count??''} سؤال • ${esc(tch[m.find(c=>c.id==q.course_id)?.teacher_id]?.name||'')}</small></span><small class="muted">${b?'أفضل نتيجة '+b.score+'/'+b.total:'ابدأ'}</small></a>`}).join('');
 return `<div class="box ls open ${done?'done':''}" id="l${l.id}">${head}<div class="lb">${vids?`<h4>${ic('video',16)} الشرح</h4>${vids}`:''}${notes?`<h4>${ic('note',16)} المذكرات والملخصات</h4>${notes}`:''}${ex?`<h4>${ic('quiz',16)} الامتحانات</h4>${ex}`:''}${m.length||files.length||exams.length?'':'<p class="empty">لا يوجد محتوى لهذا الدرس بعد.</p>'}</div></div>`}
function draw(){
 const s=subs.find(x=>x.id==S);$('#cr').innerHTML=`<a onclick="S=L=0;goto()">المواد</a>`+(s?`<i>${ic('left',14)}</i><span>${esc(s.name)}</span>`:'');
 if(!s){$('#out').innerHTML=`<p class="muted" style="margin-bottom:14px">اختر المادة</p><div class="pick">`+subs.map(x=>`<button class="pk" data-s="${x.id}"><div class="ic" style="background:${x.color||'#0878C9'}">${ico(x.icon,28)}</div><h3>${esc(x.name)}</h3><small>${ls.filter(l=>l.subject_id==x.id).length} درس</small></button>`).join('')+'</div>';return}
 const a=ls.filter(l=>l.subject_id==S);let un=null,h=RS?resumeBox(RS):'';
 a.forEach((l,i)=>{if(l.unit&&l.unit!=un){un=l.unit;h+=`<div class="un">${esc(un)}</div>`}h+=lessonHtml(l,i)});
 $('#out').innerHTML=h||'<p class="empty">لا توجد دروس بعد.</p>';
 if(L){const e=$('#l'+L);if(e){e.classList.add('hl');setTimeout(()=>e.scrollIntoView({block:'start',behavior:'smooth'}),100)}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-s],[data-tg],[data-vw]');if(!t)return;
 if(t.dataset.s){S=+t.dataset.s;L=0;return goto()}
 if(t.dataset.tg){const i=+t.dataset.tg;L=L==i?0:i;history.replaceState(null,'','#'+[S,L].filter(Boolean).join('-'));return draw()}
 if(t.dataset.vw){const f=fl.find(x=>x.id==t.dataset.vw),b=$('#vw'+f.id);if(b.innerHTML){b.innerHTML='';t.textContent='فتح'}else{b.innerHTML=frameHtml(f.url);t.textContent='إغلاق';award('file',f.id)}}});
function fromHash(){const[a,b]=location.hash.slice(1).split('-').map(Number);S=a||0;L=S&&b||0;draw();if(!L)scrollTo(0,0)}
addEventListener('hashchange',fromHash);
const ok=p=>p.catch(()=>[]);
Promise.all([get('edu_subjects?grade=eq.prep3&order=sort'),get('edu_lessons?order=sort,id'),get('edu_courses_v?select=id,lesson_id,teacher_id,title,video_url&order=id'),get('edu_courses?select=id,sort'),get('edu_teachers'),ok(get('edu_course_files?order=id')),ok(get('edu_quizzes?select=id,title,course_id,edu_quiz_questions(count)')),U()?ok(get('edu_quiz_attempts?select=quiz_id,score,total')):[],U()?ok(get('edu_progress?select=course_id,position,duration,done')):[],resume()]).then(([s,l,c,so,t,f,q,a,p,r])=>{
 const sm=Object.fromEntries(so.map(x=>[x.id,x.sort||0]));c.forEach(x=>x.sort=sm[x.id]||0);
 subs=s;ls=l.filter(x=>s.some(y=>y.id==x.subject_id));cs=c;tch=Object.fromEntries(t.map(x=>[x.id,x]));fl=f;qz=q;at=a;pg=Object.fromEntries(p.map(x=>[x.course_id,x]));RS=r;fromHash()
}).catch(()=>$('#out').innerHTML='<p class="empty">تعذر تحميل الدروس، حدّث الصفحة.</p>');
</script></body></html>
