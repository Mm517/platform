<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>البروفايل | أكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"></head>
<body class="cr" data-p="profile"><main class="pg" id="m"><h1>البروفايل</h1><p class="muted">بياناتك ونقاطك.</p><div id="o"><p class="empty">جارٍ التحميل...</p></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
topbar();
const need=()=>U()?false:(location.href='auth.html#login',true);

if(!need()){const u=U();get('edu_profiles?select=points').then(p=>{const n=p[0]?.points||0;
$('#o').innerHTML=`<div class="box tcard"><div class="av">${esc((u.name||'?').charAt(0))}</div><div><b>${esc(u.name||'')}</b><div class="muted">${esc(u.email||u.phone||'')}</div></div></div><div class="stat"><div class="box"><b>${n}</b>نقطة</div><div class="box"><b>${lvl(n)}</b>المستوى</div></div><a class="btn btn-p btn-s" href="analytics.html">عرض التحليلات</a>`})}
</script></body></html>
