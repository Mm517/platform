<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>البروفايل | أكاديمية</title>
<meta name="description" content="البروفايل | أكاديمية">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0878C9">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"></head>
<body class="cr" data-p="profile"><main class="pg adm" id="m"><h1>البروفايل</h1><p class="muted">بياناتك ونقاطك وتقديماتك.</p><div id="o"><div class="skw" aria-busy="true"><div class="sk sk-h"></div><div class="sk sk-ln" style="width:50%"></div><div class="sk sk-row"></div><div class="sk sk-row"></div></div></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
topbar();
if(!U())location.replace('auth#login');
/* ===== بنود وشروط كل نوع تقديم — غيّر النص هنا (وغيّر TV لما تعدّل البنود عشان الموافقة تتسجّل بنسخة جديدة) ===== */
const TV='v1-2026-10';
const COMMON=['جميع البيانات اللي هتكتبها لازم تكون حقيقية وتخصّك أنت. أي معلومة مزوّرة أو منتحلة تؤدي لرفض التقديم أو إلغاء القبول وحظر الحساب.','تقديمك هو طلب مراجعة فقط، وقبوله أو رفضه قرار الإدارة النهائي ولا يمنحك أي حق مكتسب. وقد نرفض دون إبداء تفاصيل إضافية.','بتوافق إن الإدارة تتواصل معاك عبر رقم الموبايل أو حسابك في المنصة بخصوص التقديم.','بياناتك تُستخدم لمراجعة التقديم فقط ولا تُنشر ولا تُباع لأي جهة، ويطّلع عليها فريق الإدارة المختص فقط. تقدر تسحب التقديم أو تطلب حذف بياناتك في أي وقت من تذكرة دعم.','المنصة تحتفظ بحقها في تعديل هذه البنود، وأي تعديل يتطلب موافقتك من جديد عند أي تقديم لاحق.'];
const TERMS={
 top_student:['التقديم مخصص للطلاب المقيّدين فعليًا في مرحلة دراسية، ولازم يكون عندك ما يثبت تفوقك (شهادة أو كشف درجات) تقدر تقدّمه عند الطلب.','لو تم قبولك، ممكن يتم ذكر اسمك الأول ومرحلتك الدراسية ضمن قائمة المتفوقين في المنصة، ولن تُنشر صورتك أو بياناتك التفصيلية إلا بموافقتك الصريحة.','لو أنت أقل من 18 سنة فلازم يكون ولي أمرك عارف ومُوافق على تقديمك.','يُمنع مشاركة محتوى المنصة المدفوع أو مشاركة بيانات حسابك مع الغير تحت أي مسمّى، ومخالفة ذلك تُسقط الصفة.',...COMMON],
 programmer:['بتقرّ إن الكود والمشاريع اللي بتذكرها هي من عملك أو إنك مصرّح لك باستخدامها، ومسؤول عن أي ادعاء ملكية غير صحيح.','أي عمل تقوم به لصالح المنصة بعد القبول يخضع لاتفاق مكتوب منفصل يحدد المقابل وحقوق الملكية. القبول المبدئي لا يُعتبر عقد عمل ولا يلزم أي طرف بمقابل مالي.','ممنوع الوصول لأي بيانات للمستخدمين أو للأنظمة أو محاولة اختراقها أو تجاوز صلاحياتك تحت أي ظرف، والإخلال بذلك يعرّضك للمساءلة القانونية.','لازم تلتزم بالسرية في كل ما يخص كود المنصة وقواعد بياناتها وأي معلومات داخلية تطّلع عليها.','لو أنت أقل من 18 سنة فلازم موافقة ولي الأمر قبل أي تعاون.',...COMMON],
 teacher:['بتقرّ إنك صاحب المحتوى التعليمي اللي هترفعه، أو معاك تصريح باستخدامه، ومينفعش تنسخ محتوى غيرك أو تنسب لنفسك شرح مدرس تاني.','المحتوى لازم يكون مناسب للمرحلة الدراسية ومطابق للمنهج، وخالٍ من أي إساءة أو دعاية سياسية أو دينية أو تجارية غير مصرّح بها.','القبول كمدرس لا يعني وجود علاقة عمل أو راتب. الاتفاق على أي مقابل أو نسبة يتم كتابةً قبل بدء النشر.','ممنوع التواصل مع الطلاب لإعطاء دروس خصوصية أو تحصيل أموال خارج المنصة عن طريق بياناتهم المتاحة لك بحكم عملك على المنصة.','الإدارة لها حق مراجعة أي محتوى وحذفه أو إيقاف حساب المدرس عند المخالفة، وتقدر تطلب حذف محتواك في أي وقت وفق ما يتم الاتفاق عليه.',...COMMON],
 sport:['لازم تكون لياقتك الصحية تسمح بممارسة الرياضة اللي بتتقدم فيها، والمنصة غير مسؤولة عن أي إصابة تحدث أثناء أي نشاط أو تدريب.','لو أنت أقل من 18 سنة فلازم تكتب بيانات ولي أمرك الحقيقية، ولا يتم أي تواصل أو ترشيح بدون موافقته الصريحة.','أي صور أو فيديوهات تُرسلها لازم تكون لك أو لديك إذن من أصحابها، ولا تحتوي على محتوى غير لائق. ولن تُنشر دون موافقتك.','تقديمك لا يضمن ترشيحك لأي نادي أو بطولة أو منحة، والمنصة وسيط للمراجعة والتوجيه فقط ولا تتقاضى منك أي رسوم على التقديم.','لو طلب منك أي شخص باسم المنصة مبالغ مالية مقابل القبول فهذا احتيال، بلّغ الدعم فورًا.',...COMMON]};
const AI={top_student:['star','لو متفوق دراسيًا أو حاصل على مراكز، قدّم لتنضم لقائمة المتفوقين.'],programmer:['code','لو بتبرمج وعايز تشارك في تطوير المنصة أو مشاريعها.'],teacher:['cap','لو مدرس وعايز تنشر شروحاتك على المنصة.'],sport:['trophy','لو لاعب أو موهوب رياضيًا وعايز فرصة ترشيح وتوجيه.']};
let APPS=[],ME0=null;
const BG={pending:'open',approved:'answered',rejected:'closed',withdrawn:'closed'};
const act=k=>APPS.find(a=>a.kind==k&&['pending','approved'].includes(a.status));
function field([k,l,t,req,x],v){const id='f_'+k,r=req?' <em style="color:#dc2626">*</em>':'';
 if(t=='area')return `<label for="${id}">${l}${r}</label><textarea id="${id}" rows="3" maxlength="800">${esc(v||'')}</textarea>`;
 if(t=='sel')return `<label for="${id}">${l}${r}</label><select id="${id}"><option value="">اختر</option>${x.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`;
 return `<label for="${id}">${l}${r}</label><input id="${id}" maxlength="200" ${t=='url'?'dir="ltr" placeholder="https://"':t=='num'?'inputmode="numeric"':''} ${typeof x=='string'?`placeholder="${esc(x)}"`:''} value="${esc(v||'')}">`}
function openForm(k){const u=U(),fs=APF[k],ph=(ME0&&ME0.phone)||'';
 document.body.insertAdjacentHTML('beforeend',`<div class="mdl" id="md"><div class="mb"><h3>${ic(AI[k][0],20)} التقديم كـ ${APK[k]}</h3><div class="form"><label>الاسم بالكامل <em style="color:#dc2626">*</em></label><input id="f_name" maxlength="80" value="${esc(u.name||'')}"><label>رقم الموبايل <em style="color:#dc2626">*</em></label><input id="f_phone" dir="ltr" inputmode="numeric" maxlength="14" value="${esc(ph)}">${fs.map(f=>field(f)).join('')}
 <div class="terms-w"><b>${ic('info',16)} البنود والشروط — اقرأها للآخر</b><div class="terms" id="tm" tabindex="0"><ol>${TERMS[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="muted">نسخة البنود: ${TV}</p></div><small class="muted" id="th">مرّر لآخر البنود لتفعيل خانة الموافقة</small>
 <label class="ne" style="opacity:.5" id="tl"><input type="checkbox" id="ta" disabled style="width:auto"> قرأت كل البنود والشروط وأوافق عليها بالكامل</label></div></div>
 <div class="acts" style="margin-top:14px"><button class="bt p" id="mok" disabled>${ic('send',16)} إرسال التقديم</button><button class="bt" id="mcx">إلغاء</button></div></div></div>`);
 const tm=document.getElementById('tm'),ta=document.getElementById('ta'),ok=document.getElementById('mok');
 const chk=()=>{if(tm.scrollTop+tm.clientHeight>=tm.scrollHeight-6){ta.disabled=false;document.getElementById('tl').style.opacity=1;document.getElementById('th').textContent='تمام — فعّل خانة الموافقة وارسل التقديم'}};
 tm.addEventListener('scroll',chk);chk();ta.onchange=()=>ok.disabled=!ta.checked;
 document.getElementById('mcx').onclick=()=>document.getElementById('md').remove();
 ok.onclick=async()=>{const v=id=>(document.getElementById(id).value||'').trim(),name=v('f_name'),phone=v('f_phone').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');
  if(name.length<3)return toast('اكتب اسمك بالكامل.',1);if(!/^01[0125]\d{8}$/.test(phone))return toast('رقم الموبايل غير صحيح (11 رقم).',1);
  const data={};for(const [fk,l,t,req] of fs){const x=v('f_'+fk);if(req&&!x)return toast('املأ حقل: '+l,1);if(t=='url'&&x&&!/^https?:\/\/\S+$/i.test(x))return toast('الرابط لازم يبدأ بـ https://',1);if(t=='num'&&x&&!/^\d{1,3}$/.test(x))return toast('اكتب رقم صحيح في: '+l,1);if(x)data[fk]=x}
  if(k=='sport'&&+data.age<18&&(!data.gname||!data.gphone))return toast('لازم بيانات ولي الأمر لأن سنك أقل من 18.',1);
  if(!ta.checked)return;ok.disabled=true;
  const r=await post('aa_edu_applications',{user_id:u.id,kind:k,full_name:name,phone,data,terms_version:TV,terms_accepted:true});
  if(!r.ok){ok.disabled=false;const t=await r.text().catch(()=>'');return toast(/23505|duplicate/i.test(t)?'عندك تقديم نشط بالفعل لهذا النوع.':'تعذر الإرسال — لو المشكلة مستمرة افتح تذكرة دعم.',1)}
  document.getElementById('md').remove();toast('تم إرسال تقديمك — هنراجعه ونبلغك بالنتيجة في الإشعارات.');await loadApps();draw()}}
async function loadApps(){APPS=await get('aa_edu_applications?select=id,kind,status,admin_note,created_at,full_name&order=created_at.desc').catch(()=>[])}
function draw(){const u=U(),n=(ME0&&ME0.points)||0;
 $('#o').innerHTML=`<div class="box tcard"><div class="av">${esc((u.name||'?').charAt(0))}</div><div><b>${esc(u.name||'')}</b><div class="muted">${esc(u.email&&!/@academy-users\.com$/.test(u.email)?u.email:u.phone||'')}</div></div></div><div class="stat"><div class="box"><b>${n}</b>نقطة</div><div class="box"><b>${lvl(n)}</b>المستوى</div></div><a class="btn btn-p btn-s" href="analytics">عرض التحليلات</a><div id="adm"></div>
 <h2 class="lsn" id="apply" style="margin-top:26px">قدّم على فرصة <small>اقرأ البنود قبل التقديم</small></h2><div class="ap-g">${Object.keys(APK).map(k=>{const a=act(k),last=APPS.find(x=>x.kind==k);
  return `<div class="box ap-c"><span class="ap-i">${ic(AI[k][0],24)}</span><b>${APK[k]}</b><small class="muted">${AI[k][1]}</small>${a?`<span class="bg ${BG[a.status]}">${APS[a.status]}</span>`:last?`<span class="bg ${BG[last.status]}">${APS[last.status]}</span>`:''}${a&&a.status=='pending'?`<button class="bt" data-w="${a.id}">سحب التقديم</button>`:a?'':`<button class="bt p" data-k="${k}">${last?'قدّم من جديد':'قدّم الآن'}</button>`}</div>`}).join('')}</div>
 ${APPS.length?`<div class="card" style="margin-top:14px"><div class="ch"><b>تقديماتي</b></div>${APPS.map(a=>`<div class="tr"><span class="t">${ic(AI[a.kind][0],18)}<span><b>${APK[a.kind]}</b><br><small>${ago(a.created_at)}${a.admin_note?' — '+esc(a.admin_note):''}</small></span></span><span class="bg ${BG[a.status]}">${APS[a.status]}</span></div>`).join('')}</div>`:''}`;
 get('aa_edu_staff?select=role').then(s=>{if(s[0])$('#adm').innerHTML=`<div class="box" style="margin-top:14px"><b>${s[0].role=='admin'?ic('crown',18)+' حسابك أدمن':'حسابك مدرس'}</b><p class="muted">${s[0].role=='admin'?'تقدر تدير الكورسات والمدرسين والصلاحيات والتقديمات ورسائل الدعم.':'تقدر تدير كورساتك.'}</p><a class="btn btn-p btn-s" href="staff">${s[0].role=='admin'?'فتح لوحة الإدارة':'فتح لوحة المدرس'}</a></div>`}).catch(()=>{});
 if(location.hash=='#apply'&&!draw.s){draw.s=1;setTimeout(()=>{const e=$('#apply');e&&e.scrollIntoView()},50)}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-k],[data-w]');if(!b)return;
 if(b.dataset.k)return openForm(b.dataset.k);
 if(b.dataset.w&&confirm('سحب التقديم؟')){const r=await rest('aa_edu_applications?id=eq.'+b.dataset.w,{method:'PATCH',body:JSON.stringify({status:'withdrawn'})});if(!r.ok)return toast('تعذر السحب.',1);await loadApps();draw();toast('تم سحب التقديم.')}});
if(U())Promise.all([ME().catch(()=>null),loadApps()]).then(([m])=>{ME0=m;if(ME0&&!ME0.phone){const u=U();ME0.phone=u.phone||''}draw()});
</script></body></html>
