<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>لوحة المدرس | أكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"></head>
<body class="cr" data-p="staff"><main class="pg"><h1>لوحة المدرس والإدارة</h1><div id="o"><p class="empty">جارٍ التحميل...</p></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
if(!U())location.replace('auth.html#login');
topbar();
document.addEventListener('click',async e=>{if(e.target.id!='acb')return;const v=$('#ac').value.trim(),m=$('#acm');if(!v)return;e.target.disabled=true;m.textContent='جارٍ التحقق...';
 try{const r=await post('rpc/edu_claim_admin',{p_code:v});const t=r.ok?await r.json():'';if(t=='تم'){m.textContent='تم تفعيل الأدمن ✓';setTimeout(()=>location.reload(),600)}else{m.textContent=t||'تعذر التفعيل — شغّل setup_admin_code.sql أولًا';e.target.disabled=false}}catch(_){m.textContent='تعذر الاتصال';e.target.disabled=false}});
let R,TID,subs=[],ls=[],ts=[],cs=[],ads=[],bks=[],ups=[],sols=[],fls=[],qzs=[],tab='c',P=null,QI=[],QT='';
const bySort=(a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id,SQLERR='تعذر الحفظ — شغّل setup_admin_edit.sql وتأكد من صلاحيات حسابك.';
const UPERR='تعذر رفع الملف. تأكد من تشغيل setup_uploads.sql ومن حجم الملف (الحد الافتراضي 50MB).';
const sel=(id,a,f)=>`<select id="${id}">${a.map(f).join('')}</select>`,fv=id=>$('#'+id).value.trim(),say=t=>{const m=$('#mg');if(m)m.textContent=t};
const fup=(id,acc,lab)=>`<div class="up"><small class="muted">${lab}</small><input type="file" id="${id}" accept="${acc}"><div class="pbar"><i id="${id}_p" style="width:0"></i></div></div>`;
const up=async(id,folder)=>{const f=$('#'+id)?.files[0];if(!f)return null;return upload(f,folder,v=>{const p=$('#'+id+'_p');if(p)p.style.width=v+'%'})};
const FA='.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,image/*',VA='video/*,.mp4,.webm,.mov';
async function load(){[subs,ls,ts,cs]=await Promise.all([get('edu_subjects?order=sort'),get('edu_lessons?order=subject_id,sort,id'),get('edu_teachers?order=id'),get('edu_courses_v?order=id')]);
 const so=await get('edu_courses?select=id,sort').catch(()=>[]),sm=Object.fromEntries(so.map(x=>[x.id,x.sort||0]));cs.forEach(c=>c.sort=sm[c.id]||0);
 if(R=='admin'){[ads,bks,ups]=await Promise.all([get('edu_ads?order=sort,id').catch(()=>[]),get('edu_books?order=id.desc').catch(()=>[]),get('edu_updates?order=created_at.desc').catch(()=>[])])}else cs=cs.filter(c=>c.teacher_id==TID);
 const ids=new Set(cs.map(c=>c.id));[sols,fls]=(await Promise.all([get('edu_course_solutions?order=id').catch(()=>[]),get('edu_course_files?order=id').catch(()=>[])])).map(a=>a.filter(x=>ids.has(x.course_id)));
 qzs=(await get('edu_quizzes?select=id,title,course_id,edu_quiz_questions(count)').catch(()=>[])).filter(q=>ids.has(q.course_id))}
const opt=(a,f,v)=>a.map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${f(x)}</option>`).join('');
const sel2=(id,a,f,v)=>`<select id="${id}">${opt(a,f,v)}</select>`;
const mv=(a,id)=>`<button class="btn btn-o btn-s" data-a="${a}" data-id="${id}" data-d="-1" title="أعلى">↑</button><button class="btn btn-o btn-s" data-a="${a}" data-id="${id}" data-d="1" title="أسفل">↓</button>`;
const lessonOpts=v=>ls.map(l=>`<option value="${l.id}" ${l.id==v?'selected':''}>${esc(subs.find(s=>s.id==l.subject_id)?.name||'')} — ${esc(l.title)}</option>`).join('');
function panel(c){if(!P||P.id!=c.id)return'';
 if(P.k=='q')return `<div class="box fm sf" style="border-color:var(--bl)"><b>اختبار جديد</b><input id="qt" value="${esc(QT)}" placeholder="عنوان الاختبار" maxlength="120">${QI.map((x,i)=>`<div class="box"><div class="row"><b>سؤال ${i+1}</b>${QI.length>1?`<button class="btn btn-o btn-s" data-a="delq" data-i="${i}">حذف</button>`:''}</div><input id="q${i}" value="${esc(x.q)}" placeholder="نص السؤال">${x.o.map((o,j)=>`<label class="row" style="justify-content:flex-start;gap:8px"><input type="radio" name="c${i}" value="${j}" ${x.a==j?'checked':''} style="width:auto"><input id="o${i}_${j}" value="${esc(o)}" placeholder="الاختيار ${j+1}"></label>`).join('')}<small class="muted">اختر الدائرة بجانب الإجابة الصحيحة</small></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-o btn-s" data-a="addq">+ سؤال</button><button class="btn btn-p btn-s" data-a="saveq">حفظ الاختبار</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`;
 if(P.k=='e')return `<div class="box fm sf" style="border-color:var(--bl)"><b>تعديل الكورس</b><select id="cl">${lessonOpts(c.lesson_id)}</select>${R=='admin'?sel2('ct',ts,t=>esc(t.name),c.teacher_id):''}<input id="cn" value="${esc(c.title)}" placeholder="عنوان الكورس" maxlength="140"><textarea id="cd" rows="3" placeholder="وصف الكورس">${esc(c.description||'')}</textarea>${fup('cif','image/*','صورة الغلاف (ارفع صورة جديدة أو اترك الحالية)')}<input id="ci" dir="ltr" value="${esc(c.image||'')}" placeholder="رابط صورة"> ${fup('cvf',VA,'فيديو الشرح (ارفع فيديو mp4 — بدون أي علامة يوتيوب)')}<input id="cv" dir="ltr" value="${esc(c.video_url||'')}" placeholder="رابط فيديو (يوتيوب / درايف / mp4)"><label><input type="checkbox" id="cf" ${c.is_free?'checked':''} style="width:auto"> مجاني</label>${R=='admin'?`<label><input type="checkbox" id="cfe" ${c.is_featured?'checked':''} style="width:auto"> ★ كورس مختار (يظهر أولًا)</label>`:''}<div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="savec" data-id="${c.id}">حفظ التعديلات</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`;
 const f=P.k=='f';return `<div class="box fm sf" style="border-color:var(--bl)"><b>${f?'إضافة ملف / مذكرة / صورة':'إضافة فيديو حل'}</b><input id="pt" placeholder="العنوان" maxlength="140">${fup('pf',f?FA:VA,f?'ارفع ملف أو صورة':'ارفع فيديو')}<input id="pl" dir="ltr" placeholder="أو الصق رابط ${f?'':'(يوتيوب / درايف / mp4)'}"><div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="savep">حفظ</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`}
const edBox=(k,id,inner,save)=>P&&P.k==k&&P.id==id?`<div class="box fm sf" style="border-color:var(--bl)">${inner}<div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="${save}" data-id="${id}">حفظ</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`:'';
function draw(){const T=[['c','الكورسات'],['l','الدروس']].concat(R=='admin'?[['t','المدرسون'],['a','الإعلانات'],['b','الكتب'],['u','التحديثات']]:[]);let b='';
 if(tab=='l')b=`<div class="box fm sf"><b>إضافة درس جديد</b>${sel('ls',subs,s=>`<option value="${s.id}">${esc(s.name)}</option>`)}<input id="lt" placeholder="عنوان الدرس" maxlength="120"><button class="btn btn-p btn-s" data-a="addl">إضافة الدرس</button></div>`+subs.map(s=>`<h3 class="lsn">${esc(s.name)}</h3>`+(ls.filter(l=>l.subject_id==s.id).map(l=>`<div class="box row"><span>${esc(l.title)} <small class="muted">${cs.filter(c=>c.lesson_id==l.id).length} كورس</small></span><span style="display:flex;gap:6px;flex-wrap:wrap">${mv('movl',l.id)}<button class="btn btn-o btn-s" data-a="rnl" data-id="${l.id}">تعديل</button><button class="btn btn-o btn-s" data-a="dell" data-id="${l.id}">حذف</button></span></div>`).join('')||'<p class="muted">لا توجد دروس.</p>')).join('');
 if(tab=='c')b=`<div class="box fm sf"><b>إضافة كورس / فيديو درس</b>${sel('cl',ls,l=>`<option value="${l.id}">${esc(subs.find(s=>s.id==l.subject_id)?.name||'')} — ${esc(l.title)}</option>`)}${R=='admin'?sel('ct',ts,t=>`<option value="${t.id}">${esc(t.name)}</option>`):''}<input id="cn" placeholder="عنوان الكورس" maxlength="140"><textarea id="cd" placeholder="وصف الكورس" rows="3"></textarea>${fup('cif','image/*','صورة الغلاف (ارفع صورة)')}<input id="ci" dir="ltr" placeholder="أو رابط صورة"> ${fup('cvf',VA,'فيديو الشرح (ارفع فيديو mp4 للأفضل)')}<input id="cv" dir="ltr" placeholder="أو رابط فيديو (يوتيوب / درايف / mp4)"><label><input type="checkbox" id="cf" checked style="width:auto"> مجاني</label><button class="btn btn-p btn-s" data-a="addc">إضافة الكورس</button></div>`+
  subs.map(s=>ls.filter(l=>l.subject_id==s.id).map(l=>{const m=cs.filter(c=>c.lesson_id==l.id).sort(bySort);return m.length?`<h3 class="lsn">${esc(s.name)} — ${esc(l.title)}</h3>`+m.map(c=>`<div class="box"><div class="row"><b>${c.is_featured?'★ ':''}${esc(c.title)}</b><span style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn btn-o btn-s" href="course.html?id=${c.id}">عرض</a><button class="btn btn-o btn-s" data-a="op" data-k="e" data-id="${c.id}">تعديل</button>${mv('movc',c.id)}</span></div><small class="muted">${esc(c.teacher_name||'')}</small>
   ${sols.filter(x=>x.course_id==c.id).map(x=>`<div class="lg"><span>▶ ${esc(x.title)}</span><span style="display:flex;gap:6px"><button class="btn btn-o btn-s" data-a="rns" data-id="${x.id}">تعديل</button><button class="btn btn-o btn-s" data-a="dels" data-id="${x.id}">حذف</button></span></div>`).join('')}
   ${fls.filter(x=>x.course_id==c.id).map(x=>`<div class="lg"><span>📄 ${esc(x.title)}</span><span style="display:flex;gap:6px"><button class="btn btn-o btn-s" data-a="rnf" data-id="${x.id}">تعديل</button><button class="btn btn-o btn-s" data-a="delf" data-id="${x.id}">حذف</button></span></div>`).join('')}
   ${qzs.filter(q=>q.course_id==c.id).map(q=>`<div class="lg"><span>📝 ${esc(q.title)} <small class="muted">${q.edu_quiz_questions?.[0]?.count??''} سؤال</small></span><button class="btn btn-o btn-s" data-a="delz" data-id="${q.id}">حذف</button></div>`).join('')}
   <div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-o btn-s" data-a="op" data-k="f" data-id="${c.id}">+ ملف/صورة</button><button class="btn btn-o btn-s" data-a="op" data-k="s" data-id="${c.id}">+ فيديو حل</button><button class="btn btn-o btn-s" data-a="op" data-k="q" data-id="${c.id}">+ اختبار</button><button class="btn btn-o btn-s" data-a="delc" data-id="${c.id}">حذف</button></div>${panel(c)}</div>`).join(''):''}).join('')).join('')||'<p class="empty">لا توجد كورسات بعد.</p>';
 if(tab=='t')b=`<div class="box fm sf"><b>إضافة مدرس</b><input id="tn" placeholder="اسم المدرس" maxlength="60"><input id="tb" placeholder="نبذة قصيرة">${fup('tif','image/*','صورة المدرس (اختياري)')}<input id="ti" dir="ltr" placeholder="أو رابط صورة"><button class="btn btn-p btn-s" data-a="addt">إضافة</button><small class="muted">لربط حساب مدرس: شغّل في SQL Editor: select edu_make_staff('رقم_الموبايل','teacher',رقم_المدرس);</small></div>`+ts.map(t=>`<div class="box"><div class="row"><span style="display:flex;gap:10px;align-items:center">${t.image?`<span class="av" style="margin:0;width:44px;height:44px;background:#fff url('${esc(t.image)}') center/cover"></span>`:''}<span>${t.id} — <b>${esc(t.name)}</b> <small class="muted">${esc(t.bio||'')}</small></span></span><span style="display:flex;gap:6px"><button class="btn btn-o btn-s" data-a="op" data-k="et" data-id="${t.id}">تعديل</button><button class="btn btn-o btn-s" data-a="delt" data-id="${t.id}">حذف</button></span></div>${edBox('et',t.id,`<b>تعديل المدرس</b><input id="tn" value="${esc(t.name)}" maxlength="60"><input id="tb" value="${esc(t.bio||'')}" placeholder="نبذة">${fup('tif','image/*','صورة جديدة')}<input id="ti" dir="ltr" value="${esc(t.image||'')}" placeholder="رابط صورة">`,'savet')}</div>`).join('');
 if(tab=='a')b=`<div class="box fm sf"><b>إضافة إعلان (يظهر في لافتة الرئيسية)</b><input id="at1" placeholder="عنوان الإعلان / اسم المتجر">${fup('aif','image/*','ارفع صورة عريضة (مقاس مناسب 1600×400)')}<input id="ai" dir="ltr" placeholder="أو رابط صورة"><input id="al" dir="ltr" placeholder="رابط عند الضغط (اختياري)"><button class="btn btn-p btn-s" data-a="adda">إضافة</button></div>`+ads.map(a=>`<div class="box"><div class="row"><span>${a.active?'🟢':'⚪'} ${esc(a.title||'')}</span><span style="display:flex;gap:6px;flex-wrap:wrap">${mv('mova',a.id)}<button class="btn btn-o btn-s" data-a="tga" data-id="${a.id}">${a.active?'إخفاء':'إظهار'}</button><button class="btn btn-o btn-s" data-a="op" data-k="ea" data-id="${a.id}">تعديل</button><button class="btn btn-o btn-s" data-a="dela" data-id="${a.id}">حذف</button></span></div>${edBox('ea',a.id,`<b>تعديل الإعلان</b><input id="at1" value="${esc(a.title||'')}">${fup('aif','image/*','صورة جديدة (عريضة)')}<input id="ai" dir="ltr" value="${esc(a.image||'')}"><input id="al" dir="ltr" value="${esc(a.link||'')}" placeholder="رابط عند الضغط">`,'savea')}</div>`).join('');
 if(tab=='b')b=`<div class="box fm sf"><b>إضافة كتاب</b><input id="bt" placeholder="عنوان الكتاب" maxlength="140"><input id="bs" placeholder="المادة (نص)">${fup('bff','.pdf,.doc,.docx,.zip','ارفع ملف الكتاب')}<input id="bu" dir="ltr" placeholder="أو رابط الكتاب">${fup('bcf','image/*','غلاف الكتاب')}<input id="bc" dir="ltr" placeholder="أو رابط الغلاف"><button class="btn btn-p btn-s" data-a="addb">إضافة</button></div>`+bks.map(x=>`<div class="box"><div class="row"><span>📚 ${esc(x.title)} <small class="muted">${esc(x.subject||'')}</small></span><span style="display:flex;gap:6px"><button class="btn btn-o btn-s" data-a="op" data-k="eb" data-id="${x.id}">تعديل</button><button class="btn btn-o btn-s" data-a="delb" data-id="${x.id}">حذف</button></span></div>${edBox('eb',x.id,`<b>تعديل الكتاب</b><input id="bt" value="${esc(x.title)}"><input id="bs" value="${esc(x.subject||'')}" placeholder="المادة">${fup('bff','.pdf,.doc,.docx,.zip','ملف جديد')}<input id="bu" dir="ltr" value="${esc(x.url||'')}">${fup('bcf','image/*','غلاف جديد')}<input id="bc" dir="ltr" value="${esc(x.cover||'')}">`,'saveb')}</div>`).join('');
 if(tab=='u')b=`<div class="box fm sf"><b>إضافة تحديث / إعلان للطلاب</b><input id="ut" placeholder="العنوان" maxlength="140"><textarea id="ub" rows="3" placeholder="التفاصيل"></textarea><button class="btn btn-p btn-s" data-a="addu">إضافة</button></div>`+ups.map(x=>`<div class="box"><div class="row"><span>📢 <b>${esc(x.title)}</b></span><span style="display:flex;gap:6px"><button class="btn btn-o btn-s" data-a="op" data-k="eu" data-id="${x.id}">تعديل</button><button class="btn btn-o btn-s" data-a="delu" data-id="${x.id}">حذف</button></span></div><div class="muted">${esc(x.body||'')}</div>${edBox('eu',x.id,`<b>تعديل التحديث</b><input id="ut" value="${esc(x.title)}"><textarea id="ub" rows="3">${esc(x.body||'')}</textarea>`,'saveu')}</div>`).join('');
 $('#o').innerHTML=`<div class="tabs">${T.map(([k,t])=>`<button class="${k==tab?'on':''}" data-t="${k}">${t}</button>`).join('')}</div><p class="msg" id="mg"></p>${b}`}
const run=async(r,m)=>{if(!r.ok){say(SQLERR);return null}P=null;await load();draw();say(m||'تم ✓');return r};
async function move(list,id,d,table){const i=list.findIndex(x=>x.id==id),j=i+d;if(i<0||j<0||j>=list.length)return;const a=list.slice();[a[i],a[j]]=[a[j],a[i]];
 const rs=await Promise.all(a.map((x,k)=>x.sort==k+1?null:rest(table+'?id=eq.'+x.id,{method:'PATCH',body:JSON.stringify({sort:k+1})})));
 if(rs.some(r=>r&&!r.ok))return say(SQLERR);await load();draw();say('تم الترتيب ✓')}
function collect(){const t=$('#qt');if(t)QT=t.value;QI=QI.map((x,i)=>{const r=document.querySelector(`input[name=c${i}]:checked`);return{q:$('#q'+i)?.value||'',o:x.o.map((_,j)=>$(`#o${i}_${j}`)?.value||''),a:r?+r.value:x.a}})}
const blank=()=>({q:'',o:['','','',''],a:0});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||!R)return;const a=b.dataset.a,id=b.dataset.id;
 if(b.dataset.t){tab=b.dataset.t;P=null;return draw()}
 if(a=='close'){P=null;return draw()}
 if(a=='op'){P={id:+id,k:b.dataset.k};if(P.k=='q'){QI=[blank()];QT=''}return draw()}
 if(a=='addq'){collect();QI.push(blank());return draw()}
 if(a=='delq'){collect();QI.splice(+b.dataset.i,1);return draw()}
 if(a=='saveq'){collect();if(QT.trim().length<2)return say('اكتب عنوان الاختبار.');
  const rows=[];for(const [n,x] of QI.entries()){const o=x.o.map(s=>s.trim()),ok=o.filter(Boolean);if(x.q.trim().length<2||ok.length<2||!o[x.a])return say('السؤال '+(n+1)+': اكتب السؤال واختيارين على الأقل، وحدد إجابة صحيحة مكتوبة.');
   rows.push({q:x.q.trim(),options:ok,answer:ok.indexOf(o[x.a]),sort:n+1})}
  b.disabled=true;const r=await post('edu_quizzes',{course_id:P.id,title:QT.trim()},'return=representation');if(!r.ok){b.disabled=false;return say('تعذر الحفظ — شغّل setup_uploads.sql.')}
  const z=(await r.json())[0];const r2=await post('edu_quiz_questions',rows.map(x=>({...x,quiz_id:z.id})));if(!r2.ok){await rest('edu_quizzes?id=eq.'+z.id,{method:'DELETE'});b.disabled=false;return say('تعذر حفظ الأسئلة.')}
  return run(r2,'تم حفظ الاختبار ✓')}
 if(a=='delz'&&confirm('حذف الاختبار؟'))return run(await rest('edu_quizzes?id=eq.'+id,{method:'DELETE'}));
 // دروس
 if(a=='addl'){if(fv('lt').length<2)return say('اكتب عنوان الدرس.');const sid=+fv('ls');return run(await post('edu_lessons',{subject_id:sid,title:fv('lt'),sort:ls.filter(l=>l.subject_id==sid).length+1}),'تمت إضافة الدرس ✓')}
 if(a=='rnl'){const l=ls.find(x=>x.id==id),t=prompt('عنوان الدرس',l.title);if(t&&t.trim().length>1)return run(await rest('edu_lessons?id=eq.'+id,{method:'PATCH',body:JSON.stringify({title:t.trim()})}));return}
 if(a=='movl'){const l=ls.find(x=>x.id==id);return move(ls.filter(x=>x.subject_id==l.subject_id).sort(bySort),id,+b.dataset.d,'edu_lessons')}
 if(a=='dell'&&confirm('حذف الدرس؟'))return run(await rest('edu_lessons?id=eq.'+id,{method:'DELETE'}));
 // كورسات
 if(a=='movc'){const c=cs.find(x=>x.id==id);return move(cs.filter(x=>x.lesson_id==c.lesson_id).sort(bySort),id,+b.dataset.d,'edu_courses')}
