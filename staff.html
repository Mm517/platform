<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>لوحة المدرس | أكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"></head>
<body class="cr" data-p="staff"><main class="pg adm"><h1>لوحة المدرس والإدارة</h1><div id="o"><p class="empty">جارٍ التحميل...</p></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
if(!U())location.replace('auth.html#login');
topbar();
let R,TID,stf=[],subs=[],ls=[],ts=[],cs=[],ads=[],bks=[],ups=[],sols=[],fls=[],qzs=[],tab='c',P=null,QI=[],QT='',us=[],OL=0;
const J=async(p,d=[])=>{const r=await post('rpc/'+p,{});return r.ok?r.json():d};
const modal=(t,h,ok)=>new Promise(res=>{document.body.insertAdjacentHTML('beforeend',`<div class="mdl" id="md"><div class="mb"><h3>${t}</h3><div class="form">${h}</div><div class="acts" style="margin-top:14px"><button class="bt p" id="mok">حفظ</button><button class="bt" id="mcx">إلغاء</button></div></div></div>`);const c=()=>$('#md').remove();$('#mcx').onclick=()=>{c();res(null)};$('#mok').onclick=async()=>{const b=$('#mok');b.disabled=true;if(await ok()===false){b.disabled=false;return}c();res(true)}});
const ICL={book:'كتاب',globe:'كرة أرضية',math:'رياضيات',flask:'علوم',map:'خريطة'},TS={open:'قيد المراجعة',answered:'تم الرد',closed:'مغلقة'},TC={general:'استفسار عام',tech:'مشكلة تقنية',account:'الحساب',content:'المحتوى',idea:'اقتراح',legacy:'رسالة قديمة'};
let tkA=[],qsA=[],rvA=[],ntA=[],TKS=0,TKM=[],TKF='all';
async function tabLoad(){if(R!='admin'&&tab!='qa')return;
 if(R=='admin'&&['o','x','n'].includes(tab))us=await J('edu_admin_users');
 if(R=='admin'&&['o','s'].includes(tab))tkA=await J('edu_admin_tickets');
 if(['o','qa'].includes(tab))qsA=(await get('edu_questions?order=created_at.desc&limit=300').catch(()=>[])).filter(x=>cs.some(c=>c.id==x.course_id));
 if(tab=='n')ntA=await get('edu_notifications?order=created_at.desc&limit=60').catch(()=>[]);
 if(tab=='rv')rvA=await get('edu_reviews?order=created_at.desc&limit=200').catch(()=>[]);
 if(tab=='s'&&TKS)TKM=await get('edu_ticket_messages?ticket_id=eq.'+TKS+'&order=created_at').catch(()=>[])}
const kc=(i,n,l)=>`<div class="kc"><span class="ki">${ic(i,22)}</span><span><b>${n}</b><small>${l}</small></span></div>`;
const ib=(a,id,i,t,x='')=>`<button class="ib ${x}" data-a="${a}" data-id="${id}" title="${t}" aria-label="${t}">${ic(i,16)}</button>`;
const cname=id=>esc(cs.find(c=>c.id==id)?.title||'كورس');
const V={
o:()=>`<div class="kp">${kc('users',us.length,'مستخدم')}${kc('layers',cs.length,'كورس')}${kc('book',ls.length,'درس')}${kc('cap',ts.length,'مدرس')}${kc('ticket',tkA.filter(t=>t.status=='open').length,'تذكرة مفتوحة')}${kc('msg',qsA.filter(q=>!q.answer).length,'سؤال بلا رد')}</div>
 <div class="card"><div class="ch"><b>آخر التذاكر</b><button class="bt" data-t="s">عرض الكل</button></div>${tkA.slice(0,5).map(t=>`<div class="tr"><span class="t">${ic('msg',18)}<span><b>${esc(t.subject)}</b><br><small>${esc(t.name||'—')} - ${ago(t.updated_at)}</small></span></span><span class="bg ${t.status}">${TS[t.status]}</span></div>`).join('')||'<p class="empty">لا توجد تذاكر.</p>'}</div>
 <div class="card"><div class="ch"><b>إجراءات سريعة</b></div><div class="cbd acts"><button class="bt p" data-t="n">${ic('bell',16)} إرسال إشعار</button><button class="bt" data-t="c">${ic('plus',16)} رفع درس أو فيديو</button><button class="bt" data-t="u">${ic('mega',16)} نشر تحديث</button><button class="bt" data-t="g">${ic('book',16)} إدارة المواد</button></div></div>`,
g:()=>`<div class="card"><div class="ch"><b>المواد الدراسية</b><button class="bt p" data-a="sjf" data-id="">${ic('plus',16)} إضافة مادة</button></div>${subs.map(s=>`<div class="tr"><span class="t"><span class="ki" style="width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;background:${esc(s.color||'#0878C9')}">${ico(s.icon,20)}</span><span><b>${esc(s.name)}</b><br><small>${ls.filter(l=>l.subject_id==s.id).length} درس</small></span></span><span class="acts">${mv('movs',s.id)}${ib('sjf',s.id,'edit','تعديل')}${ib('sjd',s.id,'trash','حذف','dg')}</span></div>`).join('')||'<p class="empty">لا توجد مواد.</p>'}</div>`,
s:()=>{if(TKS){const t=tkA.find(x=>x.id==TKS);if(!t){TKS=0;return V.s()}
  return `<button class="bt" data-a="tkb">${ic('right',16)} كل التذاكر</button><div class="card" style="margin-top:12px"><div class="ch"><span><b>${esc(t.subject)}</b><br><small class="muted">${esc(t.name||'—')} - <span dir="ltr">${esc(t.phone||'')}</span> - ${TC[t.category]||''}</small></span><span class="acts"><span class="bg ${t.status}">${TS[t.status]}</span>${t.status=='closed'?`<button class="bt" data-a="tkst" data-id="${t.id}" data-s="open">إعادة فتح</button>`:`<button class="bt" data-a="tkst" data-id="${t.id}" data-s="closed">${ic('check',16)} إغلاق</button>`}${ib('tkd',t.id,'trash','حذف التذكرة','dg')}</span></div>
  <div class="thr">${TKM.map(m=>`<div class="bub ${m.is_staff?'me':'st'}">${esc(m.body)}<small>${m.is_staff?'فريق الدعم':esc(t.name||'الطالب')} - ${ago(m.created_at)}</small></div>`).join('')||'<p class="empty">جارٍ التحميل...</p>'}</div>
  <div class="rp"><textarea id="tkt" maxlength="1500" placeholder="اكتب ردك على الطالب"></textarea><button class="bt p" data-a="tkr">${ic('send',16)} إرسال الرد</button></div></div>`}
  const F=[['all','الكل'],['open','قيد المراجعة'],['answered','تم الرد'],['closed','مغلقة']],L=tkA.filter(t=>TKF=='all'||t.status==TKF);
  return `<div class="acts" style="margin-bottom:12px">${F.map(([k,t])=>`<button class="bt ${TKF==k?'p':''}" data-a="tkf" data-f="${k}">${t}${k!='all'?' ('+tkA.filter(x=>x.status==k).length+')':''}</button>`).join('')}</div><div class="card">${L.map(t=>`<div class="tr"><span class="t">${ic('msg',18)}<span><b>${esc(t.subject)}</b><br><small>${esc(t.name||'—')} - ${TC[t.category]||''} - ${t.msgs} رسالة - ${ago(t.updated_at)}</small></span></span><span class="acts"><span class="bg ${t.status}">${TS[t.status]}</span><button class="bt" data-a="tks" data-id="${t.id}">فتح والرد</button></span></div>`).join('')||'<p class="empty">لا توجد تذاكر.</p>'}</div>`},
n:()=>`<div class="card"><div class="ch"><b>إرسال إشعار للطلاب</b></div><div class="cbd form"><label>الجمهور</label><select id="nau"><option value="all">كل الطلاب</option><option value="one">مستخدم محدد</option></select><div id="nuw" hidden><label>اختر المستخدم</label><input id="nus" list="nul" placeholder="اكتب الاسم أو رقم الموبايل"><datalist id="nul">${us.map(u=>`<option value="${esc((u.name||'')+' - '+(u.phone||''))}">`).join('')}</datalist></div><label>العنوان</label><input id="nt1" maxlength="80" placeholder="عنوان الإشعار"><label>الرسالة</label><textarea id="nb1" rows="3" maxlength="400" placeholder="نص الرسالة"></textarea><label>رابط عند الضغط (اختياري)</label><input id="nl1" dir="ltr" placeholder="courses.html"><div><button class="bt p" data-a="nts">${ic('send',16)} إرسال الإشعار</button></div></div></div>
 <div class="card"><div class="ch"><b>الإشعارات المرسلة</b></div>${ntA.map(n=>{const u=n.user_id?us.find(x=>x.id==n.user_id):null;return `<div class="tr"><span class="t">${ic('bell',18)}<span><b>${esc(n.title)}</b> <span class="bg ad">${n.user_id?esc(u?u.name:'مستخدم'):'الجميع'}</span><br><small>${esc(n.body||'')} - ${ago(n.created_at)}</small></span></span>${ib('ntd',n.id,'trash','حذف','dg')}</div>`}).join('')||'<p class="empty">لم يتم إرسال إشعارات.</p>'}</div>`,
qa:()=>`<div class="card">${qsA.slice().sort((a,b)=>!!a.answer-!!b.answer).map(q=>`<div class="tr" style="display:block"><div class="row"><span><b>${cname(q.course_id)}</b> <small class="muted">${ago(q.created_at)}</small></span>${ib('qd',q.id,'trash','حذف','dg')}</div><p style="margin:6px 0">${esc(q.body)}</p><div class="form"><textarea id="qa${q.id}" rows="2" placeholder="اكتب الرد">${esc(q.answer||'')}</textarea><div><button class="bt p" data-a="qs" data-id="${q.id}">${q.answer?'تحديث الرد':'إرسال الرد'}</button></div></div></div>`).join('')||'<p class="empty">لا توجد أسئلة.</p>'}</div>`,
rv:()=>`<div class="card">${rvA.map(r=>`<div class="tr"><span class="t">${stars(r.rating)}<span><b>${cname(r.course_id)}</b><br><small>${esc(r.comment||'بدون تعليق')} - ${ago(r.created_at)}</small></span></span>${ib('rvd',r.id,'trash','حذف','dg')}</div>`).join('')||'<p class="empty">لا توجد تقييمات.</p>'}</div>`
};

const bySort=(a,b)=>(a.sort||0)-(b.sort||0)||a.id-b.id,SQLERR='تعذر الحفظ — شغّل setup_admin_edit.sql وتأكد من صلاحيات حسابك.';
const UPERR='تعذر رفع الملف. تأكد من تشغيل setup_uploads.sql ومن حجم الملف (الحد الافتراضي 50MB).';
const sel=(id,a,f)=>`<select id="${id}">${a.map(f).join('')}</select>`,fv=id=>$('#'+id).value.trim(),say=t=>toast(t,/^(تعذر|اكتب|ارفع|غير|لا |حسابك|رقم|كلمة|السؤال|الحساب|اختر)/.test(t));
const fup=(id,acc,lab)=>`<div class="up"><small class="muted">${lab}</small><input type="file" id="${id}" accept="${acc}"><div class="pbar"><i id="${id}_p" style="width:0"></i></div></div>`;
const up=async(id,folder)=>{const f=$('#'+id)?.files[0];if(!f)return null;return upload(f,folder,v=>{const p=$('#'+id+'_p');if(p)p.style.width=v+'%'})};
const FA='.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.zip,image/*',VA='video/*,.mp4,.webm,.mov';
async function load(){[subs,ls,ts,cs]=await Promise.all([get('edu_subjects?order=sort'),get('edu_lessons?order=subject_id,sort,id'),get('edu_teachers?order=id'),get('edu_courses_v?order=id')]);
 const so=await get('edu_courses?select=id,sort').catch(()=>[]),sm=Object.fromEntries(so.map(x=>[x.id,x.sort||0]));cs.forEach(c=>c.sort=sm[c.id]||0);
 if(R=='admin'){[ads,bks,ups,stf]=await Promise.all([get('edu_ads?order=sort,id').catch(()=>[]),get('edu_books?order=id.desc').catch(()=>[]),get('edu_updates?order=created_at.desc').catch(()=>[]),post('rpc/edu_staff_list',{}).then(r=>r.ok?r.json():[]).catch(()=>[])])}else cs=cs.filter(c=>c.teacher_id==TID);
 const ids=new Set(cs.map(c=>c.id));[sols,fls]=(await Promise.all([get('edu_course_solutions?order=id').catch(()=>[]),get('edu_course_files?order=id').catch(()=>[])])).map(a=>a.filter(x=>ids.has(x.course_id)));
 qzs=(await get('edu_quizzes?select=id,title,course_id,edu_quiz_questions(count)').catch(()=>[])).filter(q=>ids.has(q.course_id))}
const opt=(a,f,v)=>a.map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${f(x)}</option>`).join('');
const sel2=(id,a,f,v)=>`<select id="${id}">${opt(a,f,v)}</select>`;
const mv=(a,id)=>`<button class="btn btn-o btn-s" data-a="${a}" data-id="${id}" data-d="-1" title="أعلى">${ic('up',16)}</button><button class="btn btn-o btn-s" data-a="${a}" data-id="${id}" data-d="1" title="أسفل">${ic('down',16)}</button>`;
const lessonOpts=v=>ls.map(l=>`<option value="${l.id}" ${l.id==v?'selected':''}>${esc(subs.find(s=>s.id==l.subject_id)?.name||'')} — ${esc(l.title)}</option>`).join('');
function panel(c){if(!P||P.id!=c.id)return'';
 if(P.k=='q')return `<div class="box fm sf" style="border-color:var(--bl)"><b>${P.qid?'تعديل الاختبار':'اختبار جديد'}</b><input id="qt" value="${esc(QT)}" placeholder="عنوان الاختبار" maxlength="120">${QI.map((x,i)=>`<div class="box"><div class="row"><b>سؤال ${i+1}</b>${QI.length>1?`<button class="btn btn-o btn-s" data-a="delq" data-i="${i}">حذف</button>`:''}</div><input id="q${i}" value="${esc(x.q)}" placeholder="نص السؤال">${x.o.map((o,j)=>`<label class="row" style="justify-content:flex-start;gap:8px"><input type="radio" name="c${i}" value="${j}" ${x.a==j?'checked':''} style="width:auto"><input id="o${i}_${j}" value="${esc(o)}" placeholder="الاختيار ${j+1}"></label>`).join('')}<small class="muted">اختر الدائرة بجانب الإجابة الصحيحة</small></div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-o btn-s" data-a="addq">+ سؤال</button><button class="btn btn-p btn-s" data-a="saveq">حفظ الاختبار</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`;
 if(P.k=='e')return `<div class="box fm sf" style="border-color:var(--bl)"><b>تعديل الكورس</b><select id="cl">${lessonOpts(c.lesson_id)}</select>${R=='admin'?sel2('ct',ts,t=>esc(t.name),c.teacher_id):''}<input id="cn" value="${esc(c.title)}" placeholder="عنوان الكورس" maxlength="140"><textarea id="cd" rows="3" placeholder="وصف الكورس">${esc(c.description||'')}</textarea>${fup('cif','image/*','صورة الغلاف (ارفع صورة جديدة أو اترك الحالية)')}<input id="ci" dir="ltr" value="${esc(c.image||'')}" placeholder="رابط صورة"> ${fup('cvf',VA,'فيديو الشرح (ارفع فيديو mp4 — بدون أي علامة يوتيوب)')}<input id="cv" dir="ltr" value="${esc(c.video_url||'')}" placeholder="رابط فيديو (يوتيوب / درايف / mp4)"><label><input type="checkbox" id="cf" ${c.is_free?'checked':''} style="width:auto"> مجاني</label>${R=='admin'?`<label><input type="checkbox" id="cfe" ${c.is_featured?'checked':''} style="width:auto"> كورس مختار (يظهر أولًا)</label>`:''}<div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="savec" data-id="${c.id}">حفظ التعديلات</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`;
 const f=P.k!='s',m=P.k=='m';return `<div class="box fm sf" style="border-color:var(--bl)"><b>${m?'إضافة ملخص':f?'إضافة ملف / صورة':'إضافة فيديو حل'}</b><input id="pt" placeholder="العنوان" maxlength="140">${fup('pf',f?FA:VA,f?'ارفع ملف أو صورة':'ارفع فيديو')}<input id="pl" dir="ltr" placeholder="أو الصق رابط ${f?'':'(يوتيوب / درايف / mp4)'}"><div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="savep">حفظ</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`}
const edBox=(k,id,inner,save)=>P&&P.k==k&&P.id==id?`<div class="box fm sf" style="border-color:var(--bl)">${inner}<div style="display:flex;gap:8px"><button class="btn btn-p btn-s" data-a="${save}" data-id="${id}">حفظ</button><button class="btn btn-o btn-s" data-a="close">إلغاء</button></div></div>`:'';
const nph=v=>String(v||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/^\+?20/,'0').replace(/\D/g,'');
async function mkAcc(phone,pw,name){const h={apikey:SUPA_KEY,'Content-Type':'application/json'};let r,j;try{r=await fetch(SUPA_URL+'/auth/v1/signup',{method:'POST',headers:h,body:JSON.stringify({email:`u${phone}@academy-users.com`,password:pw,data:{name,phone}})});j=await r.json().catch(()=>({}))}catch(_){return 'err'}
 if(!r.ok)return (j.error_code||j.code)=='user_already_exists'?'exists':'err';if(!j.access_token)return 'confirm';
 await fetch(SUPA_URL+'/rest/v1/edu_profiles?on_conflict=id',{method:'POST',headers:{...h,Authorization:'Bearer '+j.access_token,Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({id:j.user.id,name,phone,grade:'prep3'})}).catch(()=>{});return 'ok'}
const rb=(a,id,t)=>`<button class="btn btn-o btn-s" data-a="${a}" data-id="${id}">${t}</button>`;
const courseBox=c=>`<div class="box"><div class="row"><b>${c.is_featured?ic('star',14,'fill amber')+' ':''}${esc(c.title)}</b><span style="display:flex;gap:6px;flex-wrap:wrap"><a class="btn btn-o btn-s" href="course.html?id=${c.id}">عرض</a><button class="btn btn-o btn-s" data-a="op" data-k="e" data-id="${c.id}">تعديل</button>${mv('movc',c.id)}</span></div><small class="muted">${esc(c.teacher_name||'')}</small>`+
 sols.filter(x=>x.course_id==c.id).map(x=>`<div class="lg"><span>${ic('video',16)} ${esc(x.title)}</span><span style="display:flex;gap:6px">${rb('rns',x.id,'تعديل')}${rb('dels',x.id,'حذف')}</span></div>`).join('')+
 fls.filter(x=>x.course_id==c.id).map(x=>`<div class="lg"><span>${x.kind=='summary'?ic('note',16)+' ملخص:':ic('file',16)} ${esc(x.title)}</span><span style="display:flex;gap:6px">${rb('rnf',x.id,'تعديل')}${rb('delf',x.id,'حذف')}</span></div>`).join('')+
 qzs.filter(q=>q.course_id==c.id).map(q=>`<div class="lg"><span>${ic('quiz',16)} ${esc(q.title)} <small class="muted">${q.edu_quiz_questions?.[0]?.count??''} سؤال</small></span><span style="display:flex;gap:6px">${rb('eq',q.id,'تعديل')}${rb('delz',q.id,'حذف')}</span></div>`).join('')+
 `<div style="margin:8px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-o btn-s" data-a="op" data-k="f" data-id="${c.id}">+ ملف/صورة</button><button class="btn btn-o btn-s" data-a="op" data-k="m" data-id="${c.id}">+ ملخص</button><button class="btn btn-o btn-s" data-a="op" data-k="s" data-id="${c.id}">+ فيديو حل</button><button class="btn btn-o btn-s" data-a="op" data-k="q" data-id="${c.id}">+ اختبار</button>${rb('delc',c.id,'حذف')}</div>${panel(c)}</div>`;
const addCourse=l=>`<div class="box fm sf"><b>إضافة فيديو / كورس داخل «${esc(l.title)}»</b>${R=='admin'?sel('nct',ts,t=>`<option value="${t.id}">${esc(t.name)}</option>`):''}<input id="ncn" placeholder="عنوان الفيديو / الكورس" maxlength="140"><textarea id="ncd" placeholder="وصف (اختياري)" rows="2"></textarea>${fup('ncif','image/*','صورة الغلاف (اختياري)')}<input id="nci" dir="ltr" placeholder="أو رابط صورة">${fup('ncvf',VA,'فيديو الشرح (ارفع mp4 للأفضل)')}<input id="ncv" dir="ltr" placeholder="أو رابط فيديو (يوتيوب / درايف / mp4)"><label><input type="checkbox" id="ncf" checked style="width:auto"> مجاني</label><button class="btn btn-p btn-s" data-a="addc" data-id="${l.id}">إضافة</button></div>`;
