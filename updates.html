<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحديثات | أكاديمية</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="app.css"></head>
<body class="cr" data-p="updates"><main class="pg" id="m"><h1>التحديثات</h1><p class="muted">آخر الأخبار والكورسات الجديدة.</p><div id="o"><p class="empty">جارٍ التحميل...</p></div></main>
<script src="config.js"></script><script src="lib.js"></script>
<script>
topbar();
const need=()=>U()?false:(location.href='auth.html#login',true);

Promise.all([get('edu_courses_v?order=id.desc&limit=5'),get('edu_updates?order=created_at.desc').catch(()=>[])]).then(([c,u])=>{
$('#o').innerHTML=u.map(x=>`<div class="box"><b>${ic('mega',18)} ${esc(x.title)}</b><div>${esc(x.body||'')}</div><small class="muted">${new Date(x.created_at).toLocaleDateString('ar-EG')}</small></div>`).join('')+c.map(x=>`<a class="box row" href="course.html?id=${x.id}"><span>${ic('plus',16)} كورس جديد: <b>${esc(x.title)}</b> — ${esc(x.teacher_name)}</span><span class="muted">عرض</span></a>`).join('')||'<p class="empty">لا توجد تحديثات.</p>'});
</script></body></html>
